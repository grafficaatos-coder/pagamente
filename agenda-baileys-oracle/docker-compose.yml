services:
  whatsapp:
    build: .
    container_name: agenda-pro-baileys
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - agenda_whatsapp_sessions:/data/sessions
    networks:
      - agenda_net

  caddy:
    image: caddy:2-alpine
    container_name: agenda-pro-caddy
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - agenda_net

networks:
  agenda_net:

volumes:
  agenda_whatsapp_sessions:
  caddy_data:
  caddy_config:
