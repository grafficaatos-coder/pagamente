    function home(){const p=P(),next=A[2]||A[0];return shell(`<section class="hero"><div><span class="eyebrow">Visão geral · ${p.segment}</span><h2>${greeting()}, Ana 👋</h2><p>${p.homeCopy}</p>${segmentSwitch()}</div><span class="date-chip">${I.calendar}${todayText()}</span></section><section class="dashboard-grid"><article class="next-card"><span class="eyebrow">Próximo ${p.appointment.toLowerCase()}</span><h3>Seu próximo horário está chegando</h3><div class="next-time">${next[0]}</div><div class="next-person">${next[1]}</div><div class="next-service">${next[2]} · ${next[3]}</div><div class="next-meta"><span class="light-tag">⏱ ${p.services.find(s=>s[0]===next[2])?.[1]||'50 min'}</span><span class="light-tag">${p.services.find(s=>s[0]===next[2])?.[2]||'Agendado'}</span><span class="light-tag">${next[4]==='p'?'Pendente':'Confirmado'}</span></div><div class="next-actions"><button onclick="toast('Confirmação enviada no modo demonstração')">Confirmar pelo WhatsApp</button><button onclick="go('agenda')">Ver agenda</button></div></article><section class="metrics">${p.metrics.map(m=>metric(...m)).join('')}</section></section><section class="section-grid"><section class="panel"><div class="head"><div><span class="eyebrow">Agenda de hoje</span><h3>Próximos ${p.appointments.toLowerCase()}</h3></div><button class="btn secondary" onclick="go('agenda')">Abrir agenda</button></div>${A.map(appointment).join('')}</section><aside class="panel"><div class="head"><div><span class="eyebrow">Atalhos</span><h3>Acesso rápido</h3></div></div><div class="quick-list"><div class="quick-card" onclick="book()"><div class="quick-ico">${I.plus}</div><div><b>Novo horário</b><small>Cadastre ${p.appointment.toLowerCase()}</small></div><span class="arrow">›</span></div><div class="quick-card" onclick="go('clients')"><div class="quick-ico">${I.userplus}</div><div><b>Novo ${p.person.toLowerCase()}</b><small>Adicione à sua base</small></div><span class="arrow">›</span></div><div class="quick-card" onclick="go('services')"><div class="quick-ico">${I.sparkle}</div><div><b>${p.services}</b><small>Veja seu catálogo</small></div><span class="arrow">›</span></div><div class="quick-card" onclick="go('wa')"><div class="quick-ico">${I.message}</div><div><b>WhatsApp</b><small>Configure lembretes</small></div><span class="arrow">›</span></div></div></aside></section>`)}
    function agenda(){const p=P(),week=[['Seg','05/10',A.slice(0,2)],['Ter','06/10',A.slice(1,3)],['Qua','07/10',A.slice(2,4)],['Qui','08/10',A.slice(3,5)],['Sex','09/10',[A[0],A[2],A[4]].filter(Boolean)]],counts={1:2,2:3,4:1,5:2,6:2,7:2,8:1,9:3,10:2,12:2,13:1,14:3,15:2,16:2,19:3,20:1,21:2,22:2,23:3,26:2,27:2,28:1,29:2,30:3};let body='';if(agendaView==='day')body=`<section class="panel"><div class="head"><div><span class="eyebrow">Hoje</span><h3>Agenda do dia</h3></div><span class="tag">${A.length} horários</span></div>${A.map(appointment).join('')}</section>`;if(agendaView==='week')body=`<div class="weekgrid">${week.map(d=>`<section class="daycol"><div class="dayhead"><b>${d[0]}</b><small>${d[1]}</small></div>${d[2].map(x=>`<div class="mini"><b><span class="dot"></span>${x[0]} · ${x[1]}</b><small>${x[2]}</small></div>`).join('')}</section>`).join('')}</div>`;if(agendaView==='month'){let boxes=['28','29','30'];for(let i=1;i<=31;i++)boxes.push(String(i));body=`<section class="month"><div class="month-label">DOM</div><div class="month-label">SEG</div><div class="month-label">TER</div><div class="month-label">QUA</div><div class="month-label">QUI</div><div class="month-label">SEX</div><div class="month-label">SÁB</div>${boxes.map((d,i)=>{const n=Number(d),muted=i<3,today=!muted&&n===4;return `<div class="daybox ${muted?'muted':''} ${today?'today':''}"><b>${d}</b>${!muted&&counts[n]?`<span class="count">${counts[n]} horários</span>`:''}</div>`}).join('')}</section>`}return shell(`<div class="section-title"><span class="eyebrow">Organização · ${p.segment}</span><h2>Sua agenda</h2><p>Controle ${p.appointments.toLowerCase()} de forma rápida e visual.</p></div><div class="toolbar"><div class="search-wrap">${I.search}<input class="search" placeholder="Buscar ${p.person.toLowerCase()}"></div><button class="btn primary" onclick="book()">+ Horário</button></div><div class="agenda-header"><div class="viewtoggle"><button class="${agendaView==='day'?'on':''}" onclick="setAgendaView('day')">Dia</button><button class="${agendaView==='week'?'on':''}" onclick="setAgendaView('week')">Semana</button><button class="${agendaView==='month'?'on':''}" onclick="setAgendaView('month')">Mês</button></div><div class="agenda-date"><button onclick="toast('Período anterior')">‹</button><span>Outubro 2026</span><button onclick="toast('Próximo período')">›</button></div></div>${body}`)}
    function clients(){const p=P();return shell(`<div class="section-title"><span class="eyebrow">Relacionamento</span><h2>${p.people}</h2><p>Histórico, contato e informações de cada ${p.person.toLowerCase()}.</p></div><div class="toolbar"><div class="search-wrap">${I.search}<input class="search" placeholder="Buscar ${p.person.toLowerCase()}"></div><button class="btn primary" onclick="toast('Cadastro de ${p.person.toLowerCase()} aberto')">+ ${p.person}</button></div><div class="list">${p.peopleData.map(c=>`<div class="card client"><div class="round">${c[0].split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><b>${c[0]}</b><small>${c[1]} · ${c[2]} ${p.visit}</small></div><div class="client-stat"><b>${c[3]}</b><small>${p.key==='doctor'?'Atendimento':'Total gasto'}</small></div><button class="client-action" onclick="toast('Abrindo WhatsApp de ${c[0]}')" aria-label="WhatsApp">${I.message}</button></div>`).join('')}</div>`)}
    function services(){const p=P();return shell(`<div class="section-title"><span class="eyebrow">${p.catalog}</span><h2>${p.services}</h2><p>Organize duração, valor e ${p.professional.toLowerCase()} responsável.</p></div><div class="toolbar"><div></div><button class="btn primary" onclick="toast('Novo ${p.service.toLowerCase()}')">+ ${p.service}</button></div><div class="services">${p.services.map(s=>`<article class="card service"><div class="service-icon">${s[3]}</div><h3>${s[0]}</h3><p>Disponível para agendamento. Você pode editar valor, duração e ${p.professional.toLowerCase()}.</p><footer><span>${s[1]}</span><b>${s[2]}</b></footer></article>`).join('')}</div>`)}
    function cash(){const p=P(),bars=[42,58,52,78,67,88,72];if(p.key==='doctor')return shell(`<div class="section-title"><span class="eyebrow">Gestão</span><h2>Resumo do consultório</h2><p>Indicadores administrativos de agenda e atendimentos.</p></div><div class="money"><div class="card"><span>Consultas realizadas</span><b>96</b><small style="color:var(--green-ink);font-weight:800">▲ 8% no mês</small></div><div class="card"><span>Cancelamentos</span><b>7</b><small style="color:var(--muted)">Taxa de 6,8%</small></div><div class="card"><span>Retornos</span><b>31</b><small style="color:var(--green-ink);font-weight:800">32% dos atendimentos</small></div></div><div class="context-note"><b>Agenda médica:</b> esta demonstração cuida do agendamento e da gestão administrativa. Prontuário, prescrições, exames e dados clínicos exigem controles específicos de segurança e não fazem parte deste protótipo.</div>`);return shell(`<div class="section-title"><span class="eyebrow">Financeiro</span><h2>Caixa</h2><p>Acompanhe faturamento, despesas e resultado.</p></div><div class="money"><div class="card"><span>Entradas</span><b>R$ 18.940</b><small style="color:var(--green-ink);font-weight:800">▲ 12% no mês</small></div><div class="card"><span>Despesas</span><b>R$ 5.280</b><small style="color:var(--muted)">Materiais e operação</small></div><div class="card"><span>Saldo</span><b>R$ 13.660</b><small style="color:var(--green-ink);font-weight:800">Resultado positivo</small></div></div><div class="finance-grid"><section class="panel"><div class="head"><div><span class="eyebrow">Últimos 7 dias</span><h3>Faturamento</h3></div><b>R$ 4.280</b></div><div class="chart">${bars.map((h,i)=>`<div class="bar-wrap"><div class="bar" style="height:${h}%"></div><small>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</small></div>`).join('')}</div></section><section class="panel"><div class="head"><div><span class="eyebrow">Movimentações</span><h3>Recentes</h3></div></div><div class="finance-summary">${A.slice(0,4).map((x,i)=>`<div class="finance-row"><span>${x[2]} · ${x[1]}</span><b>+ ${p.services.find(s=>s[0]===x[2])?.[2]||'R$ 0'}</b></div>`).join('')}</div></section></div>`)}
    function wa(){const p=P(),x=[['Confirmação ao salvar horário',`Envia assim que ${p.appointment.toLowerCase()} é criado`],['Lembrete 24h',`Um dia antes de ${p.appointment.toLowerCase()}`],['Lembrete 2h','No dia, pouco antes do horário'],['Pós-atendimento',p.key==='doctor'?'Mensagem administrativa após a consulta':'Pedido de avaliação da experiência']];return shell(`<div class="section-title"><span class="eyebrow">Automação</span><h2>WhatsApp <span class="demo">DEMO</span></h2><p>Prepare confirmações e lembretes para reduzir faltas.</p></div><section class="panel" style="margin-bottom:10px"><div class="head"><div><span class="eyebrow">Status</span><h3>Integração ainda não conectada</h3></div><span class="tag p">Modo demonstração</span></div><p style="color:var(--muted);margin:6px 0 0;line-height:1.55">As opções abaixo já fazem parte do fluxo. O envio real será ativado quando conectarmos uma conta/provedor de WhatsApp.</p></section><div class="list">${x.map((i,n)=>`<div class="card auto"><div><b>${i[0]}</b><small style="display:block;color:var(--muted);margin-top:3px">${i[1]}</small></div><div class="toggle ${n<3?'on':''}" onclick="this.classList.toggle('on')"></div></div>`).join('')}</div>`)}
    function setup(){const p=P();return shell(`<div class="section-title"><span class="eyebrow">Personalização</span><h2>Tipo de negócio</h2><p>O sistema adapta automaticamente linguagem e fluxo de agendamento.</p></div><div class="setup-grid">${Object.values(PROFILES).map(x=>`<button class="setup-card ${x.key===segment?'on':''}" onclick="setSegment('${x.key}')"><span class="big-emoji">${x.emoji}</span><b>${x.segment}</b><small>${x.key==='salon'?'Clientes, serviços, profissionais, agenda e caixa.':x.key==='esthetic'?'Clientes, procedimentos, sessões, profissionais e pacotes.':'Pacientes, consultas, médicos, convênio e teleconsulta.'}</small></button>`).join('')}</div><div class="profile-row"><div class="profile-box"><span>Empresa demonstrada</span><b>${p.business}</b></div><div class="profile-box"><span>Terminologia ativa</span><b>${p.people} · ${p.services} · ${p.professionals}</b></div></div><div class="context-note"><b>Multiempresa:</b> na versão comercial, cada assinante terá seu próprio cadastro, logo, equipe, horários, serviços e dados isolados. Esta tela demonstra como um único produto pode atender segmentos diferentes.</div>`)}
    function more(){const p=P();return shell(`<div class="section-title"><span class="eyebrow">Configurações</span><h2>Mais opções</h2><p>Personalize o sistema para ${p.business}.</p></div><div class="more-list"><button class="more-btn" onclick="go('admin')"><div class="quick-ico">${I.wallet}</div><b>Administração da plataforma</b><small>Planos, mensalidades, assinantes e bloqueios</small></button><button class="more-btn" onclick="go('setup')"><div class="quick-ico"><span style="font-size:18px">${p.emoji}</span></div><b>Tipo de negócio</b><small>${p.segment} · alterar modo</small></button><button class="more-btn" onclick="go('services')"><div class="quick-ico">${I.sparkle}</div><b>${p.services}</b><small>Duração, valores e catálogo</small></button><button class="more-btn" onclick="go('wa')"><div class="quick-ico">${I.message}</div><b>WhatsApp</b><small>Confirmações e lembretes</small></button><button class="more-btn" onclick="book()"><div class="quick-ico">${I.calendar}</div><b>Novo horário</b><small>Cadastre ${p.appointment.toLowerCase()}</small></button><button class="more-btn" onclick="toast('Relatórios em breve')"><div class="quick-ico">${I.chart}</div><b>Relatórios</b><small>Indicadores de ${p.business}</small></button></div>`)}
    function admin(){const active=ADMIN.clients.filter(c=>c.status==='active').length,late=ADMIN.clients.filter(c=>c.status==='late').length,blocked=ADMIN.clients.filter(c=>c.status==='blocked').length,mrr=ADMIN.clients.filter(c=>c.status==='active').reduce((a,c)=>a+c.monthly,0);return shell(`<div class="section-title"><span class="eyebrow">Área do proprietário</span><h2>Administração da plataforma</h2><p>Controle planos, mensalidades e acesso dos seus clientes.</p></div><div class="owner-note"><b>Área reservada para você.</b> Seus clientes não veem esta administração. Este acesso está separado pelo login do proprietário.</div><div class="admin-kpis"><div class="admin-kpi"><span>Assinantes ativos</span><b>${active}</b><small>empresas pagando</small></div><div class="admin-kpi"><span>Receita mensal ativa</span><b>${moneyBR(mrr)}</b><small>MRR demonstrativo</small></div><div class="admin-kpi"><span>Pagamentos atrasados</span><b>${late}</b><small>precisam de cobrança</small></div><div class="admin-kpi"><span>Acessos bloqueados</span><b>${blocked}</b><small>empresas suspensas</small></div></div><div class="admin-tabs"><button class="${adminTab==='clients'?'on':''}" onclick="setAdminTab('clients')">Assinantes</button><button class="${adminTab==='plans'?'on':''}" onclick="setAdminTab('plans')">Planos e preços</button></div>${adminTab==='plans'?adminPlans():adminClients()}`)}
    function adminPlans(){return `<div class="plans-grid">${ADMIN.plans.map(pl=>`<article class="card plan-card ${pl.popular?'popular':''}"><div class="plan-head"><div><span class="eyebrow">Plano</span><h3>${pl.name}</h3></div><span class="status-badge ${pl.active?'status-active':'status-blocked'}">${pl.active?'Visível':'Oculto'}</span></div><div class="plan-price">${moneyBR(pl.price)} <small>/mês</small></div><div class="plan-desc">${pl.desc}</div><div class="feature-list">${pl.features.map(f=>`<div class="feature"><i>✓</i><span>${f}</span></div>`).join('')}</div><div class="plan-actions"><button class="btn secondary" onclick="editPlan('${pl.id}')">Editar preço</button><button class="btn ${pl.active?'secondary':'primary'}" onclick="togglePlan('${pl.id}')">${pl.active?'Ocultar':'Mostrar'}</button></div></article>`).join('')}</div><div class="context-note" style="margin-top:14px"><b>Como funcionará:</b> você poderá definir quais recursos cada plano libera. Quando um cliente mudar de plano, as permissões serão aplicadas automaticamente na conta dele.</div>`}
    function adminClients(){return `<section class="panel"><div class="head"><div><span class="eyebrow">Clientes da plataforma</span><h3>Assinantes</h3></div><button class="btn primary" onclick="addDemoClient()">+ Novo cliente</button></div><div style="overflow-x:auto"><table class="client-table"><thead><tr><th>Empresa</th><th>Segmento</th><th>Plano</th><th>Mensalidade</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead><tbody>${ADMIN.clients.map(c=>{const pl=ADMIN.plans.find(p=>p.id===c.plan);return `<tr><td data-label="Empresa"><b>${c.name}</b><small>#${String(c.id).padStart(4,'0')}</small></td><td data-label="Segmento">${c.segment}</td><td data-label="Plano"><b>${pl?.name||'—'}</b><small onclick="changeClientPlan(${c.id})" style="cursor:pointer;color:var(--wine);font-weight:800">Trocar plano</small></td><td data-label="Mensalidade">${moneyBR(c.monthly)}</td><td data-label="Vencimento">${c.due}</td><td data-label="Status"><span class="status-badge ${c.status==='active'?'status-active':c.status==='late'?'status-late':'status-blocked'}">${c.status==='active'?'Ativo':c.status==='late'?'Atrasado':'Bloqueado'}</span></td><td data-label="Ações"><div class="table-actions"><button class="mini-btn" onclick="markPaid(${c.id})">Marcar pago</button><button class="mini-btn ${c.status==='blocked'?'':'danger'}" onclick="toggleClient(${c.id})">${c.status==='blocked'?'Desbloquear':'Bloquear'}</button></div></td></tr>`}).join('')}</tbody></table></div></section>`}
    function moneyBR(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
    function setAdminTab(v){adminTab=v;render()}
    function editPlan(id){const pl=ADMIN.plans.find(p=>p.id===id);const v=prompt(`Novo valor mensal do plano ${pl.name}:`,String(pl.price).replace('.',','));if(v===null)return;const n=Number(v.replace('.','').replace(',','.'));if(!Number.isFinite(n)||n<=0)return toast('Digite um valor válido');pl.price=n;ADMIN.clients.filter(c=>c.plan===id).forEach(c=>c.monthly=n);saveAdmin();render();toast('Preço do plano atualizado')}
    function togglePlan(id){const pl=ADMIN.plans.find(p=>p.id===id);pl.active=!pl.active;saveAdmin();render();toast(pl.active?'Plano visível para venda':'Plano ocultado da venda')}
    function changeClientPlan(id){const c=ADMIN.clients.find(x=>x.id===id),opts=ADMIN.plans.map((p,i)=>`${i+1} - ${p.name} (${moneyBR(p.price)})`).join('\n'),choice=prompt(`Escolha o novo plano para ${c.name}:\n${opts}`);if(choice===null)return;const pl=ADMIN.plans[Number(choice)-1];if(!pl)return toast('Plano inválido');c.plan=pl.id;c.monthly=pl.price;saveAdmin();render();toast('Plano do cliente alterado')}
    function markPaid(id){const c=ADMIN.clients.find(x=>x.id===id);c.status='active';saveAdmin();render();toast('Pagamento marcado como recebido')}
    function toggleClient(id){const c=ADMIN.clients.find(x=>x.id===id);c.status=c.status==='blocked'?'active':'blocked';saveAdmin();render();toast(c.status==='blocked'?'Acesso do cliente bloqueado':'Acesso do cliente liberado')}
    function addDemoClient(){const name=prompt('Nome da empresa:');if(!name)return;const seg=prompt('Segmento:','Salão de beleza')||'Outro',pl=ADMIN.plans[0],id=Math.max(0,...ADMIN.clients.map(c=>c.id))+1;ADMIN.clients.push({id,name,segment:seg,plan:pl.id,status:'active',due:'10/11/2026',monthly:pl.price});saveAdmin();render();toast('Novo cliente adicionado')}
    function booking(){const p=P();return `<div class="booking"><div class="bookwrap"><section class="bookintro"><div class="logo">${p.initials}</div><h1>Novo horário</h1><p>Cadastre ${p.appointment.toLowerCase()} com todas as informações importantes em uma única tela.</p><button class="btn secondary" onclick="go('agenda')">← Voltar</button></section><section class="book"><div class="book-title"><div><span class="eyebrow">${p.segment}</span><h2>Cadastrar ${p.appointment.toLowerCase()}</h2><p>Preencha os dados de ${p.person.toLowerCase()} e ${p.service.toLowerCase()}.</p></div><span class="tag">Novo</span></div><div class="book-summary"><div><span>Tipo</span><b>${p.appointment}</b></div><div><span>Status inicial</span><b>Confirmado</b></div><div><span>WhatsApp</span><b>Ativo</b></div></div><div class="formgrid"><div class="field"><b>${p.person}</b><select id="fclient" onchange="fillPhone()"><option value="">Selecione</option>${p.peopleData.map(c=>`<option value="${c[0]}">${c[0]}</option>`).join('')}<option value="nova">+ Novo ${p.person.toLowerCase()}</option></select></div><div class="field"><b>WhatsApp</b><input id="fphone" placeholder="(41) 99999-9999"></div><div class="field"><b>${p.service}</b><select id="fservice">${p.services.map(x=>`<option>${x[0]}</option>`).join('')}</select></div><div class="field"><b>${p.professional}</b><select id="fpro">${p.pros.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><b>Data</b><input id="fdate" type="date"></div><div class="field"><b>Horário</b><input id="ftime" type="time"></div>${p.key==='doctor'?'':`<div class="field"><b>Valor</b><input id="fvalue" placeholder="R$ 0,00"></div>`}${p.extra}<div class="field"><b>Status</b><select id="fstatus"><option>Confirmado</option><option>Pendente</option></select></div></div><div class="field"><b>Observação administrativa</b><textarea id="fnote" placeholder="${p.notePlaceholder}"></textarea></div>${p.key==='doctor'?'<div class="context-note"><b>Privacidade:</b> use esta área apenas para organização do agendamento. Não registre diagnóstico, resultado de exame, receita ou outras informações clínicas sensíveis neste protótipo.</div>':''}<label class="checkrow"><input id="fsend" type="checkbox" checked><span><b>Enviar confirmação no WhatsApp ao salvar</b><small style="display:block;color:var(--muted);margin-top:3px">Modo demonstração <span class="demo">WhatsApp ainda não conectado</span></small></span></label><button class="btn primary" style="width:100%;margin-top:12px;min-height:48px" onclick="saveAppointment()">Salvar horário</button></section></div></div>`}
    function fillPhone(){const n=document.getElementById('fclient').value,c=P().peopleData.find(x=>x[0]===n);document.getElementById('fphone').value=c?c[1]:''}
    function saveAppointment(){const p=P(),client=document.getElementById('fclient').value,phone=document.getElementById('fphone').value,service=document.getElementById('fservice').value,pro=document.getElementById('fpro').value,date=document.getElementById('fdate').value,time=document.getElementById('ftime').value,status=document.getElementById('fstatus').value,send=document.getElementById('fsend').checked;if(!client||client==='nova'||!phone||!date||!time)return toast(`Preencha ${p.person.toLowerCase()}, WhatsApp, data e horário`);A.unshift([time,client,service,pro,status==='Pendente'?'p':'c']);page='agenda';agendaView='day';render();setTimeout(()=>toast(send?'Horário salvo · confirmação de WhatsApp simulada':'Horário salvo'),100)}

    function loginView(){return `<div class="login-screen"><section class="login-brand"><div class="logo">AP</div><h1>Controle sua plataforma em um só lugar.</h1><p>Entre como proprietário para administrar assinantes, planos, mensalidades e acesso das empresas que usam o Agenda Pro.</p><div class="login-feature"><i>✓</i> Planos e valores mensais</div><div class="login-feature"><i>✓</i> Assinantes ativos e atrasados</div><div class="login-feature"><i>✓</i> Bloqueio e liberação de acesso</div></section><section class="login-panel"><form class="login-card" onsubmit="ownerLogin(event)"><span class="eyebrow">Acesso do proprietário</span><h2>Entrar no Agenda Pro</h2><p>Use seu login administrativo para acessar a gestão da plataforma.</p><div class="login-field"><label>Login</label><input id="ownerLogin" autocomplete="username" placeholder="Digite seu login" autofocus></div><div class="login-field"><label>Senha</label><input id="ownerPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div><div id="loginError" class="login-error"></div><button class="btn primary" style="width:100%;min-height:48px" type="submit">Entrar como proprietário</button><div class="login-help"><b>Versão de teste.</b> Este login funciona somente neste protótipo. Na publicação comercial, a autenticação será conectada ao banco de dados e a senha ficará protegida no servidor.</div></form></section></div>`}
    function ownerLogin(ev){ev?.preventDefault();const u=(document.getElementById('ownerLogin')?.value||'').trim().toLowerCase(),p=(document.getElementById('ownerPassword')?.value||'').trim(),e=document.getElementById('loginError');if(u===OWNER_AUTH.user&&(p===OWNER_AUTH.pass||p===OWNER_AUTH.legacyPass)){ownerLogged=true;sessionStorage.setItem('agendaProOwner','1');page='admin';render();setTimeout(()=>toast('Bem-vindo à administração da plataforma'),80);return false}if(e)e.textContent='Login ou senha incorretos.';return false}
    function ownerLogout(){sessionStorage.removeItem('agendaProOwner');ownerLogged=false;page='home';render()}

    function setAgendaView(v){agendaView=v;render()}
    function go(p){if(!ownerLogged){render();return}page=p;render();scrollTo(0,0)}
    function book(){if(!ownerLogged){render();return}page='book';render();scrollTo(0,0)}
    function toast(x){const e=document.getElementById('toast');e.textContent=x;e.hidden=false;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.hidden=true,1900)}
    function render(){document.title=ownerLogged?`${P().brand} · Proprietário`:'Agenda Pro · Login';if(!ownerLogged){R.innerHTML=loginView();return}R.innerHTML=page==='book'?booking():({home,agenda,clients,services,cash,wa,more,setup,admin}[page]||home)()}
    render();
  </script>
</body>
