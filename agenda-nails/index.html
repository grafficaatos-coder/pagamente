    /* Modais profissionais v1 */
    body.app-modal-open{overflow:hidden}
    .app-modal-layer{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px}
    .app-modal-backdrop{position:absolute;inset:0;background:rgba(30,21,26,.48);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:modalFade .16s ease}
    .app-modal{
      position:relative;z-index:1;width:min(100%,640px);max-height:min(88vh,760px);overflow:auto;
      background:#fff;border:1px solid rgba(94,67,79,.12);border-radius:20px;
      box-shadow:0 28px 80px rgba(39,25,32,.22);animation:modalUp .18s ease
    }
    .app-modal.wide{width:min(100%,760px)}
    .app-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
    .app-modal-title h2{margin:3px 0 5px;font-size:21px;line-height:1.15;letter-spacing:-.035em}
    .app-modal-title p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
    .app-modal-close{
      width:36px;height:36px;flex:0 0 auto;border:1px solid var(--line);border-radius:10px;background:#fff;
      color:#766a70;font-size:21px;line-height:1;display:grid;place-items:center
    }
    .app-modal-close:hover{background:#f7f4f5;color:var(--wine)}
    .app-modal-body{padding:20px 24px}
    .app-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .app-modal-grid .full{grid-column:1/-1}
    .app-modal-field{display:grid;gap:7px;min-width:0}
    .app-modal-field label{font-size:10px;font-weight:850;color:#4f464b}
    .app-modal-field input,.app-modal-field select,.app-modal-field textarea{
      width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);
      padding:12px 13px;outline:none;transition:.15s ease
    }
    .app-modal-field textarea{min-height:92px;resize:vertical}
    .app-modal-field input:focus,.app-modal-field select:focus,.app-modal-field textarea:focus{
      border-color:#a47b8e;box-shadow:0 0 0 3px rgba(97,54,74,.08)
    }
    .app-modal-hint{color:var(--muted);font-size:9px;line-height:1.45}
    .app-modal-toggles{display:grid;gap:9px;margin-top:2px}
    .app-toggle-row{
      display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 13px;
      border:1px solid var(--line);border-radius:12px;background:#faf9f9
    }
    .app-toggle-copy b,.app-toggle-copy small{display:block}
    .app-toggle-copy b{font-size:11px}
    .app-toggle-copy small{margin-top:3px;color:var(--muted);font-size:9px;line-height:1.4}
    .app-switch{position:relative;width:44px;height:25px;flex:0 0 auto}
    .app-switch input{position:absolute;opacity:0;pointer-events:none}
    .app-switch span{position:absolute;inset:0;border-radius:999px;background:#d7d0d3;transition:.18s}
    .app-switch span:after{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.18s}
    .app-switch input:checked+span{background:var(--wine)}
    .app-switch input:checked+span:after{transform:translateX(19px)}
    .app-modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:15px 24px 20px;border-top:1px solid var(--line)}
    .app-modal-actions .btn{min-width:112px}
    .app-modal-actions .btn[disabled]{opacity:.62;cursor:wait}
    .app-modal-note{padding:11px 13px;border:1px solid #eadfe3;background:#faf7f8;border-radius:11px;color:#75676e;font-size:9px;line-height:1.5}
    @keyframes modalFade{from{opacity:0}to{opacity:1}}
    @keyframes modalUp{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
    @media(max-width:640px){
      .app-modal-layer{padding:10px;align-items:end}
      .app-modal{width:100%;max-height:92dvh;border-radius:20px 20px 10px 10px}
      .app-modal.wide{width:100%}

    }

  const st=companyCtx.subscription?.status;
  if(st==='suspended'||st==='cancelled')return true;
  const now=new Date();
  if(st==='trialing'){
    if(companyCtx.settings?.free_trial_enabled===false)return true;
    if(companyCtx.subscription?.trial_ends_at&&new Date(companyCtx.subscription.trial_ends_at)<now)return true;
  }

    const d=new Date(companyCtx.subscription.current_period_end);
    d.setDate(d.getDate()+Number(companyCtx.settings.grace_days||0));

  }

}

  }else{
    const monthStart=new Date(anchor.getFullYear(),anchor.getMonth(),1,12,0,0);

      const list=all.filter(a=>agendaDateKey(a.starts_at)===key);
      if(d.getMonth()===monthStart.getMonth())visibleCount+=list.length;
      const muted=d.getMonth()!==monthStart.getMonth();
      const times=list.slice(0,2).map(a=>{
        const ad=new Date(a.starts_at),cu=customerMap.get(a.customer_id);

      }).join('');
      return `<div class="daybox clickable ${muted?'muted':''} ${key===todayKey?'today':''}" onclick="openAgendaDay('${key}')"><b>${d.getDate()}</b>${list.length?`<div class="count">${list.length} horário${list.length===1?'':'s'}</div><div class="month-times">${times}</div>`:''}</div>`;

  }

  return shell(`<div class="section-title"><span class="eyebrow">${p.segment}</span><h2>Sua agenda</h2><p>Veja seus horários por dia, semana ou mês.</p></div>
  <div class="toolbar"><div class="search-wrap">${I.search}<input class="search" placeholder="Buscar ${p.person.toLowerCase()}" oninput="filterAgendaRows(this.value)"></div>${canOperateCompany()?'<button class="btn primary" onclick="book()">+ Horário</button>':''}</div>

  ${viewHtml}`);

    function normalizeWhatsPhone(phone){
  let n=String(phone||'').replace(/\D/g,'');

  if(!n)return'';

    function openWhatsAppDirect(phone,message,preopenedWindow=null){
  const normalized=normalizeWhatsPhone(phone);
  if(!normalized)return false;
  const encoded=encodeURIComponent(String(message||''));
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
  const url=isMobile
    ? 'whatsapp://send?phone='+normalized+'&text='+encoded
    : 'https://web.whatsapp.com/send?phone='+normalized+'&text='+encoded;
  try{
    if(preopenedWindow&&!preopenedWindow.closed){
      preopenedWindow.location.href=url;
    }else if(isMobile){
      window.location.href=url;
    }else{
      window.open(url,'_blank','noopener,noreferrer');
    }
    return true;
  }catch(err){
    console.error(err);
    const fallback='https://wa.me/'+normalized+'?text='+encoded;
    window.open(fallback,'_blank','noopener,noreferrer');
    return false;
  }
}

    async function saveMyProfile(){
  if(!sb||!authUser||!companyCtx)return;
  const name=(document.getElementById('profileName')?.value||'').trim();
  const phone=(document.getElementById('profilePhone')?.value||'').replace(/\D/g,'');
  const email=(document.getElementById('profileEmail')?.value||'').trim().toLowerCase();
  const msg=document.getElementById('profileSaveMessage');
  const btn=document.getElementById('profileSaveButton');
  if(name.length<2){if(msg)msg.textContent='Informe seu nome.';return}
  if(phone.length<10||phone.length>13){if(msg)msg.textContent='Informe um telefone válido com DDD.';return}
  if(!/^\S+@\S+\.\S+$/.test(email)){if(msg)msg.textContent='Informe um e-mail válido.';return}
  if(btn){btn.disabled=true;btn.textContent='Salvando...'}
  if(msg)msg.textContent='';
  try{
    const {error:profileError}=await sb.from('profiles').update({
      display_name:name,
      phone,
      updated_at:new Date().toISOString()
    }).eq('id',authUser.id);
    if(profileError)throw profileError;

    if(companyRole()==='owner'){
      const {error:businessPhoneError}=await sb.from('agenda_businesses').update({
        phone,
        updated_at:new Date().toISOString()
      }).eq('id',companyCtx.business.id);
      if(businessPhoneError)console.error(businessPhoneError);
      companyCtx.business.phone=phone;
    }

    let emailPending=false;
    if(email!==String(authUser.email||'').toLowerCase()){
      const {data:updateData,error:emailError}=await sb.auth.updateUser(
        {email},
        {emailRedirectTo:AGENDA_PRO_URL}
      );
      if(emailError)throw emailError;
      emailPending=true;
      if(updateData?.user)authUser=updateData.user;
    }

    companyCtx.profile={...(companyCtx.profile||{}),display_name:name,phone};
    render();
    const out=document.getElementById('profileSaveMessage');
    if(out)out.textContent=emailPending
      ?'Nome e telefone salvos. Confirme o novo e-mail na mensagem enviada para concluir a alteração.'
      :'Perfil atualizado com sucesso.';
    toast(emailPending?'Confirme o novo e-mail':'Perfil atualizado');
  }catch(err){
    console.error(err);
    const out=document.getElementById('profileSaveMessage');
    if(out)out.textContent=String(err?.message||'Não foi possível atualizar o perfil.');
  }finally{
    const b=document.getElementById('profileSaveButton');
    if(b){b.disabled=false;b.textContent='Salvar alterações'}
  }
}

    function cash(){
  const serviceMap=new Map(companyData.services.map(s=>[s.id,s]));
  const customerMap=new Map(companyData.customers.map(x=>[x.id,x]));
  const confirmed=companyData.appointments.filter(a=>a.status==='confirmed'&&financeInPeriod(a.starts_at));
  const completed=companyData.appointments.filter(a=>a.status==='completed'&&financeInPeriod(a.starts_at));
  const receivable=confirmed.reduce((sum,a)=>sum+Number(serviceMap.get(a.service_id)?.price_cents||0),0)/100;
  const autoReceived=completed.reduce((sum,a)=>sum+Number(serviceMap.get(a.service_id)?.price_cents||0),0)/100;
  const manual=(companyData.financialEntries||[]).filter(e=>financeInPeriod(e.occurred_on));
  const manualIncome=manual.filter(e=>e.type==='income').reduce((s,e)=>s+Number(e.amount_cents||0),0)/100;
  const expenses=manual.filter(e=>e.type==='expense').reduce((s,e)=>s+Number(e.amount_cents||0),0)/100;
  const totalIncome=autoReceived+manualIncome;
  const balance=totalIncome-expenses;
  const incomeCount=manual.filter(e=>e.type==='income').length;
  const expenseCount=manual.filter(e=>e.type==='expense').length;
  const filtered=manual.filter(e=>financeKind==='all'||e.type===financeKind);

  const rows=[];
  if(financeKind!=='expense'&&autoReceived>0){
    rows.push(`<div class="finance-item"><div class="finance-icon income">↗</div><div class="finance-item-main"><b>Atendimentos concluídos</b><small>Entrada automática · ${completed.length} atendimento(s)</small></div><div class="finance-amount income">+${moneyBR(autoReceived)}</div><span></span></div>`);
  }
  rows.push(...filtered.map(e=>{
    const income=e.type==='income';
    const date=new Date(e.occurred_on+'T12:00:00').toLocaleDateString('pt-BR');
    const meta=[date,e.category,e.payment_method].filter(Boolean).join(' · ');
    return `<div class="finance-item"><div class="finance-icon ${income?'income':'expense'}">${income?'↗':'↘'}</div><div class="finance-item-main"><b>${e.description}</b><small>${meta||'Lançamento manual'}${e.notes?' · '+e.notes:''}</small></div><div class="finance-amount ${income?'income':'expense'}">${income?'+':'-'}${moneyBR(Number(e.amount_cents||0)/100)}</div>${canAdminCompany()?`<button class="finance-delete" onclick="deleteFinanceEntry('${e.id}')" aria-label="Excluir">×</button>`:'<span></span>'}</div>`;
  }));

  const receivableRows=confirmed
    .slice()
    .sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))
    .map(a=>{
      const d=new Date(a.starts_at);
      const service=serviceMap.get(a.service_id);
      const customer=customerMap.get(a.customer_id);
      const value=Number(service?.price_cents||0)/100;
      const dateTop=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      const when=d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<div class="receivable-row"><div class="receivable-date">${dateTop.replace('/','<br>')}</div><div class="receivable-main"><b>${customer?.name||'Cliente'}</b><small>${service?.name||'Serviço'} · ${when}${a.professional_name?' · '+a.professional_name:''}</small></div><div class="receivable-value">${moneyBR(value)}</div><div class="receivable-actions">${canOperateCompany()?`<button class="btn secondary" onclick="updateAppointmentStatus('${a.id}','completed')">Marcar recebido</button>`:''}</div></div>`;
    }).join('');

  const incomeCategories=['Venda','Produto','Comissão','Adiantamento','Outros'];
  const expenseCategories=['Aluguel','Produtos e materiais','Salários','Comissões','Água/Luz/Internet','Impostos','Marketing','Manutenção','Outros'];
  const cats=(financeEntryType==='income'?incomeCategories:expenseCategories).map(x=>`<option>${x}</option>`).join('');
  const form=financeFormOpen?`<section class="panel finance-entry-form">
    <div class="head"><div><span class="eyebrow">${financeEntryType==='income'?'Entrada':'Saída'}</span><h3>Novo lançamento</h3></div><span class="finance-type-chip ${financeEntryType}">${financeEntryType==='income'?'Valor recebido':'Valor pago'}</span></div>
    <div class="finance-entry-form-grid">
      <div class="field"><b>Descrição</b><input id="financeDescription" placeholder="${financeEntryType==='income'?'Ex.: Venda de produto':'Ex.: Compra de material'}"></div>
      <div class="field"><b>Valor</b><input id="financeAmount" inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><b>Data</b><input id="financeDate" type="date" value="${financeToday()}"></div>
      <div class="field"><b>Categoria</b><select id="financeCategory">${cats}</select></div>
      <div class="field"><b>Forma de pagamento</b><select id="financePayment"><option value="">Não informar</option><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Boleto</option></select></div>
      <div class="field" style="grid-column:span 3"><b>Observação</b><input id="financeNotes" placeholder="Opcional"></div>
    </div>
    <div class="form-actions"><button class="btn secondary" onclick="closeFinanceEntry()">Cancelar</button><button class="btn primary" onclick="saveFinanceEntry()">Salvar ${financeEntryType==='income'?'entrada':'saída'}</button></div>
  </section>`:''; 

  const summary=`<div class="money"><div class="card finance-income"><span>Entradas recebidas</span><b>${moneyBR(totalIncome)}</b><small>${completed.length} atendimento(s) concluído(s) + ${incomeCount} lançamento(s)</small></div><div class="card"><span>A receber</span><b>${moneyBR(receivable)}</b><small>${confirmed.length} agendamento(s) confirmado(s)</small></div><div class="card finance-expense"><span>Saídas</span><b>${moneyBR(expenses)}</b><small>${expenseCount} lançamento(s)</small></div><div class="card finance-balance"><span>Saldo</span><b>${moneyBR(balance)}</b><small>${balance>=0?'Caixa positivo':'Caixa negativo'}</small></div></div>`;

  const tabs=`<div class="finance-tabs"><button class="${financeTab==='cash'?'on':''}" onclick="setFinanceTab('cash')">Caixa</button><button class="${financeTab==='receivable'?'on':''}" onclick="setFinanceTab('receivable')">A receber <span class="count">${confirmed.length}</span></button></div>`;

  const cashView=`${form}${summary}<div class="finance-grid"><section class="panel finance-history"><div class="finance-history-head"><div><span class="eyebrow">Movimentações</span><h3>Entradas e saídas</h3></div><div class="finance-filters"><button class="finance-filter ${financeKind==='all'?'on':''}" onclick="setFinanceKind('all')">Todas</button><button class="finance-filter ${financeKind==='income'?'on':''}" onclick="setFinanceKind('income')">Entradas</button><button class="finance-filter ${financeKind==='expense'?'on':''}" onclick="setFinanceKind('expense')">Saídas</button></div></div><div class="finance-list">${rows.join('')||'<div class="empty-state" style="margin:16px">Nenhuma movimentação neste período.</div>'}</div></section>
  <aside class="finance-side"><section class="panel"><div class="head"><div><span class="eyebrow">Resumo</span><h3>Movimento do caixa</h3></div></div><div class="finance-summary"><div class="finance-row"><span>Entradas manuais</span><b>${moneyBR(manualIncome)}</b></div><div class="finance-row"><span>Atendimentos recebidos</span><b>${moneyBR(autoReceived)}</b></div><div class="finance-row"><span>Total de saídas</span><b>${moneyBR(expenses)}</b></div><div class="finance-row"><span>Saldo atual</span><b>${moneyBR(balance)}</b></div></div></section><div class="finance-auto-note"><b>Regra automática</b>Agendamentos pendentes não entram no financeiro. Ao confirmar, o valor aparece em “A receber”. Ao concluir o atendimento, ele passa para as entradas recebidas. Cancelados não contam.</div></aside></div>`;

  const receivableView=`${summary}<section class="panel finance-history"><div class="finance-history-head"><div><span class="eyebrow">Contas a receber</span><h3>Agendamentos confirmados</h3></div><b>${moneyBR(receivable)}</b></div><div class="receivable-list">${receivableRows||'<div class="empty-state" style="margin:16px">Nenhum valor a receber neste período.</div>'}</div></section><div class="finance-auto-note" style="margin-top:12px"><b>Como funciona</b>Somente agendamentos confirmados aparecem aqui. Quando o atendimento for concluído, toque em “Marcar recebido” ou altere o status para Concluído na Agenda; o valor sai de “A receber” e entra em “Entradas recebidas”.</div>`;

  return shell(`<div class="section-title"><span class="eyebrow">Financeiro</span><h2>Controle financeiro</h2><p>Separe o que já entrou no caixa dos valores que ainda estão a receber.</p></div>
  <div class="finance-toolbar"><div class="finance-actions"><button class="btn finance-add-income" onclick="openFinanceEntry('income')">+ Entrada</button><button class="btn finance-add-expense" onclick="openFinanceEntry('expense')">− Saída</button></div><div class="finance-filters"><button class="finance-filter ${financePeriod==='month'?'on':''}" onclick="setFinancePeriod('month')">Este mês</button><button class="finance-filter ${financePeriod==='all'?'on':''}" onclick="setFinancePeriod('all')">Todo período</button></div></div>
  ${tabs}
  ${financeTab==='receivable'?receivableView:cashView}`);
}
    async function callAgendaWhatsApp(payload){
  if(!sb)throw new Error('Sessão indisponível');
  const {data}=await sb.auth.getSession();
  const token=data?.session?.access_token;
  if(!token)throw new Error('Sessão expirada');
  const r=await fetch(AGENDA_WHATSAPP_FUNCTION,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+token
    },
    body:JSON.stringify(payload)
  });
  const out=await r.json().catch(()=>({}));
  if(!r.ok){
    const err=new Error(out.error||'Erro na integração do WhatsApp');
    err.code=out.code||'whatsapp_error';
    throw err;
  }
  return out;
}

    sb.from('agenda_whatsapp_messages').select('id,to_phone,message_type,status,meta_message_id,error_message,created_at').eq('business_id',bid).order('created_at',{ascending:false}).limit(10)
  ]);
  if(connRes.error)console.error(connRes.error);
  if(msgRes.error)console.error(msgRes.error);

    function metaSignupMessageListener(event){
  if(event.origin!=='https://www.facebook.com'&&event.origin!=='https://web.facebook.com')return;
  let data=event.data;
  try{if(typeof data==='string')data=JSON.parse(data)}catch(e){return}
  if(!data||data.type!=='WA_EMBEDDED_SIGNUP')return;
  const info=data.data||{};
  if(info.waba_id||info.phone_number_id){
    metaEmbeddedCapture={
      waba_id:String(info.waba_id||''),
      phone_number_id:String(info.phone_number_id||'')
    };
  }
}
    function ensureMetaListener(){
  if(metaListenerReady)return;
  window.addEventListener('message',metaSignupMessageListener);
  metaListenerReady=true;
}
    function loadFacebookSdk(appId){
  if(window.FB){
    try{window.FB.init({appId,cookie:true,xfbml:false,version:'v26.0'})}catch(e){}
    return Promise.resolve(window.FB);
  }
  if(fbSdkPromise)return fbSdkPromise;
  fbSdkPromise=new Promise((resolve,reject)=>{
    const prev=window.fbAsyncInit;
    window.fbAsyncInit=function(){
      try{
        window.FB.init({appId,cookie:true,xfbml:false,version:'v26.0'});
        if(typeof prev==='function')try{prev()}catch(e){}
        resolve(window.FB);
      }catch(e){reject(e)}
    };
    const s=document.createElement('script');
    s.async=true;s.defer=true;s.crossOrigin='anonymous';
    s.src='https://connect.facebook.net/pt_BR/sdk.js';
    s.onerror=()=>reject(new Error('Não foi possível carregar a conexão da Meta'));
    document.head.appendChild(s);
  });
  return fbSdkPromise;
}
    function waitForMetaCapture(timeout=15000){
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    const timer=setInterval(()=>{
      if(metaEmbeddedCapture.phone_number_id){
        clearInterval(timer);resolve({...metaEmbeddedCapture});return;
      }
      if(Date.now()-started>=timeout){
        clearInterval(timer);reject(new Error('A Meta não retornou o número do WhatsApp. Tente conectar novamente.'));
      }
    },250);
  });
}
    async function startWhatsEmbeddedSignup(){
  if(!canAdminCompany())return toast('Somente o administrador da empresa pode conectar');
  const btn=document.getElementById('waSimpleConnectBtn');
  const err=document.getElementById('waSimpleConnectError');
  if(btn){btn.disabled=true;btn.textContent='Abrindo Meta...'}
  if(err)err.textContent='';
  try{
    const cfg=await callWhatsOnboarding({action:'config'});
    if(!cfg.configured){
      throw new Error('A conexão simplificada ainda precisa ser ativada pelo proprietário da plataforma.');
    }
    ensureMetaListener();
    metaEmbeddedCapture={waba_id:'',phone_number_id:''};
    const FB=await loadFacebookSdk(cfg.app_id);
    FB.login(async(response)=>{
      try{
        const code=response?.authResponse?.code;
        if(!code)throw new Error('A autorização foi cancelada antes de concluir.');
        const info=await waitForMetaCapture();
        await callWhatsOnboarding({
          action:'exchange',
          code,
          waba_id:info.waba_id,
          phone_number_id:info.phone_number_id
        });
        await loadWhatsappStatus(false);
        render();
        toast('WhatsApp Business conectado com sucesso');
      }catch(ex){
        console.error(ex);
        const el=document.getElementById('waSimpleConnectError');
        if(el)el.textContent=ex.message||'Não foi possível concluir a conexão';
        const b=document.getElementById('waSimpleConnectBtn');
        if(b){b.disabled=false;b.textContent='Conectar meu WhatsApp Business'}
      }
    },{
      config_id:cfg.config_id,
      response_type:'code',
      override_default_response_type:true,
      extras:{setup:{},sessionInfoVersion:'3'}
    });
  }catch(ex){
    console.error(ex);
    if(err)err.textContent=ex.message||'Não foi possível iniciar a conexão';
    if(btn){btn.disabled=false;btn.textContent='Conectar meu WhatsApp Business'}
  }

    async function loadWhatsappQueue(redraw=false){
  if(!sb||!companyCtx)return;
  const {data,error}=await sb.from('agenda_whatsapp_queue')
    .select('*')
    .eq('business_id',companyCtx.business.id)
    .in('status',['pending','opened'])
    .order('scheduled_for',{ascending:true})
    .limit(100);
  if(error){console.error(error);return}
  whatsappQueue=data||[];
  checkWhatsappQueueNotifications();
  if(redraw&&(page==='wa'||page==='services'))render();
}
    async function openWhatsappQueueItem(id){

  if(!item)return;
  const phone=normalizeWhatsPhone(item.customer_phone);
  if(!phone)return toast('Esta cliente está sem WhatsApp cadastrado');
  const msg=queueMessage(item);
  let w=null;
  try{w=window.open('about:blank','_blank')}catch(e){}
  const {error}=await sb.from('agenda_whatsapp_queue').update({
    status:'opened',
    opened_at:new Date().toISOString(),
    updated_at:new Date().toISOString()
  }).eq('id',id).eq('business_id',companyCtx.business.id);
  if(error)console.error(error);
  item.status='opened';
  openWhatsAppDirect(phone,msg,w);

    function formatBusinessPhone(phone){
  const n=String(phone||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');
  if(n.length===11)return '('+n.slice(0,2)+') '+n.slice(2,7)+'-'+n.slice(7);
  if(n.length===10)return '('+n.slice(0,2)+') '+n.slice(2,6)+'-'+n.slice(6);
  return phone||'Não cadastrado';
}

    function startAppointmentStatusSync(){

      companyData.appointments=data;
      if(['home','agenda','cash'].includes(page))render();

    function openAppModal({title,subtitle='',content='',submitLabel='Salvar',size='',onSubmit}){
  closeAppModal();
  const layer=document.createElement('div');
  layer.id='appModalLayer';
  layer.className='app-modal-layer';
  layer.innerHTML=`<div class="app-modal-backdrop" data-modal-close></div><section class="app-modal ${size==='wide'?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="appModalTitle"><form id="appModalForm"><header class="app-modal-head"><div class="app-modal-title"><span class="eyebrow">Agenda Pro</span><h2 id="appModalTitle">${appModalEscape(title)}</h2>${subtitle?`<p>${appModalEscape(subtitle)}</p>`:''}</div><button class="app-modal-close" type="button" data-modal-close aria-label="Fechar">×</button></header><div class="app-modal-body">${content}</div><footer class="app-modal-actions"><button class="btn secondary" type="button" data-modal-close>Cancelar</button><button class="btn primary" id="appModalSubmit" type="submit">${appModalEscape(submitLabel)}</button></footer></form></section>`;
  document.body.appendChild(layer);
  document.body.classList.add('app-modal-open');
  layer.querySelectorAll('[data-modal-close]').forEach(el=>el.addEventListener('click',closeAppModal));
  appModalSubmitHandler=onSubmit;
  const form=layer.querySelector('#appModalForm');
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const btn=document.getElementById('appModalSubmit');
    if(btn){btn.disabled=true;btn.dataset.original=btn.textContent;btn.textContent='Salvando...'}
    try{if(appModalSubmitHandler)await appModalSubmitHandler()}
    catch(err){console.error(err);toast(err?.message||'Não foi possível concluir a ação')}
    finally{
      const current=document.getElementById('appModalSubmit');
      if(current){current.disabled=false;current.textContent=current.dataset.original||submitLabel}
    }
  });
  appModalKeyHandler=ev=>{if(ev.key==='Escape')closeAppModal()};
  document.addEventListener('keydown',appModalKeyHandler);
  setTimeout(()=>layer.querySelector('[autofocus],input,select,textarea')?.focus(),40);
}
    function askAppConfirm({title,message,confirmLabel='Excluir'}){
  return new Promise(resolve=>{
    closeAppModal();
    const layer=document.createElement('div');
    layer.id='appModalLayer';
    layer.className='app-modal-layer';
    layer.innerHTML=`<div class="app-modal-backdrop"></div><section class="app-modal app-confirm-modal" role="alertdialog" aria-modal="true"><div class="app-modal-head"><div class="app-modal-title"><span class="eyebrow">Confirmação</span><h2>${appModalEscape(title)}</h2><p>${appModalEscape(message)}</p></div><button class="app-modal-close" type="button" data-cancel aria-label="Fechar">×</button></div><div class="app-modal-body"><div class="app-confirm-icon">!</div><div class="app-confirm-copy"><b>Esta ação precisa da sua confirmação.</b><span>Revise antes de continuar.</span></div></div><div class="app-modal-actions"><button class="btn secondary" type="button" data-cancel>Cancelar</button><button class="btn app-danger-btn" type="button" data-confirm>${appModalEscape(confirmLabel)}</button></div></section>`;
    document.body.appendChild(layer);
    document.body.classList.add('app-modal-open');
    let done=false;
    let key=null;
    const finish=value=>{
      if(done)return;done=true;
      if(key)document.removeEventListener('keydown',key);
      const el=document.getElementById('appModalLayer');if(el)el.remove();
      document.body.classList.remove('app-modal-open');
      resolve(value);
    };
    layer.querySelector('.app-modal-backdrop')?.addEventListener('click',()=>finish(false));
    layer.querySelectorAll('[data-cancel]').forEach(el=>el.addEventListener('click',()=>finish(false)));
    layer.querySelector('[data-confirm]')?.addEventListener('click',()=>finish(true));
    key=ev=>{if(ev.key==='Escape')finish(false)};
    document.addEventListener('keydown',key);
    setTimeout(()=>layer.querySelector('[data-confirm]')?.focus(),30);
  });
}

    async function loadOwnerData(){
      if(!sb)return;
      const [plansRes,bizRes,subRes,membersRes,settingsRes]=await Promise.all([
        sb.from('agenda_plans').select('*').order('monthly_price_cents'),
        sb.from('agenda_businesses').select('*').order('created_at',{ascending:false}),
        sb.from('agenda_subscriptions').select('*'),
        sb.from('agenda_members').select('business_id,user_id,role'),
        sb.from('agenda_platform_settings').select('*').eq('id',true).maybeSingle()
      ]);
      const firstError=plansRes.error||bizRes.error||subRes.error||membersRes.error||settingsRes.error;
      if(firstError){console.error(firstError);throw firstError}
      const plans=plansRes.data||[],businesses=bizRes.data||[],subs=subRes.data||[],members=membersRes.data||[];
      const cfg=settingsRes.data||{};
      ADMIN.settings={
        ...ADMIN.settings,
        autoBlock:cfg.auto_block??ADMIN.settings.autoBlock,
        freeTrial:cfg.free_trial_enabled??ADMIN.settings.freeTrial,
        publicSignup:cfg.public_signup_enabled??ADMIN.settings.publicSignup,
        trialDays:cfg.trial_days??ADMIN.settings.trialDays,
        graceDays:cfg.grace_days??ADMIN.settings.graceDays,
        baileysEnabled:cfg.baileys_enabled??false,
        baileysServiceUrl:cfg.baileys_service_url||''
      };
      ADMIN.plans=plans.map(p=>({
        id:p.id,code:p.code,name:p.name,price:Number(p.monthly_price_cents||0)/100,
        active:!!p.visible,maxUsers:p.max_users??999,desc:p.description||'',
        permissions:{...(p.permissions||{}),finance:true},popular:p.code==='profissional'
      }));
      const planById=new Map(plans.map(p=>[p.id,p]));
      const subByBiz=new Map(subs.map(s=>[s.business_id,s]));
      ADMIN.clients=businesses.map(b=>{
        const s=subByBiz.get(b.id),pl=planById.get(s?.plan_id);
        const currentUsers=members.filter(m=>m.business_id===b.id).length;
        return {
          id:b.id,businessId:b.id,name:b.name,segment:segmentLabel(b.segment),segmentKey:b.segment,
          plan:pl?.code||'essencial',planId:pl?.id,
          status:s?.status==='trialing'?'trial':s?.status==='past_due'?'late':s?.status==='suspended'||b.manual_blocked?'blocked':'active',
          due:s?.current_period_end?new Date(s.current_period_end).toLocaleDateString('pt-BR'):'—',
          monthly:Number(pl?.monthly_price_cents||0)/100,currentUsers,
          phone:b.phone||'',
          trialUntil:s?.trial_ends_at?new Date(s.trial_ends_at).toLocaleDateString('pt-BR'):null,
          manualBlocked:!!b.manual_blocked,subscription:s
        };
      });
    }

    async function callBaileys(action,method='GET',payload=null){
  const {data}=await sb.auth.getSession();
  const token=data?.session?.access_token;
  if(!token)throw new Error('Sessão expirada');
  let r;
  try{
    r=await fetch(AGENDA_BAILEYS_PROXY_FUNCTION,{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+token,
        'apikey':SUPABASE_KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({action,method,payload})
    });
  }catch(ex){
    console.error(ex);
    throw new Error('Não foi possível acessar o serviço do WhatsApp. Tente novamente em instantes.');
  }
  const out=await r.json().catch(()=>({}));
  if(!r.ok){
    const msg=out.error||'Falha na conexão do WhatsApp';
    throw new Error(msg);
  }
  return out;
}

    };

    function startBaileysPoll(){

  baileysPollTimer=setInterval(async()=>{

      clearInterval(baileysPollTimer);baileysPollTimer=null;return;
    }

    if(baileysSession.status==='connected'){

    }
  },2500);

    async function connectBaileys(){

  const err=document.getElementById('baileysConnectError');
  if(btn){btn.disabled=true;btn.textContent='Gerando QR Code...'}
  if(err)err.textContent='';
  try{
    const out=await callBaileys('connect','POST');
    baileysSession={
      status:out.status||'connecting',
      phone:out.phone||null,
      qr_svg:out.qr_svg||null,
      last_error:out.last_error||null
    };
    render();
    if(baileysSession.status!=='connected')startBaileysPoll();
    else toast('WhatsApp conectado');
  }catch(ex){
    console.error(ex);
    baileysSession={status:'error',phone:null,qr_svg:null,pairing_code:null,last_error:ex.message};
    render();
  }
}
    async function connectBaileysByPhone(forcedPhone=''){
  const input=document.getElementById('baileysPhone');
  const btn=document.getElementById('baileysPhoneBtn');
  const err=document.getElementById('baileysConnectError');
  const phone=normalizeWhatsPhone(forcedPhone||input?.value||baileysPreferredPhone());
  if(!phone)return toast('Digite o número do WhatsApp com DDD');
  if(btn){btn.disabled=true;btn.textContent='Preparando conexão...'}
  if(err)err.textContent='';
  try{
    // Sempre encerra uma tentativa antiga antes de pedir outro código.
    try{
      await callBaileys('disconnect','POST');
    }catch(resetError){
      console.warn('Não foi possível limpar a sessão anterior',resetError);
    }
    baileysSession={status:'disconnected',phone:null,qr_svg:null,pairing_code:null,last_error:null};
    await new Promise(resolve=>setTimeout(resolve,700));

    const out=await callBaileys('pair-code','POST',{phone});
    const code=String(out.pairing_code||'').replace(/\s/g,'').toUpperCase();
    if(!code)throw new Error('O servidor não gerou um código de conexão. Tente novamente.');
    baileysSession={
      ...baileysSession,
      status:out.status||'qr',
      phone:out.phone||phone,
      pairing_code:code,
      last_error:null
    };
    render();
    startBaileysPoll();
    toast('Novo código gerado. Use este código agora no WhatsApp.');
  }catch(ex){
    console.error(ex);
    baileysSession={status:'disconnected',phone:null,qr_svg:null,pairing_code:null,last_error:ex.message};
    render();
    toast(ex.message||'Não foi possível gerar o código');
  }finally{
    const b=document.getElementById('baileysPhoneBtn');
    if(b){b.disabled=false;b.textContent='Gerar código de conexão'}
  }
}
    function regenerateBaileysCode(){
  return connectBaileysByPhone(baileysPreferredPhone());

    function makePlanCode(name){
  let base=String(name||'plano').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,36)||'plano';
  let code=base,i=2;
  while(ADMIN.plans.some(p=>p.code===code)){code=base+'-'+i;i++}
  return code;
}

    async function deletePlan(id){
  const pl=ADMIN.plans.find(p=>p.id===id);if(!pl)return;
  if(ADMIN.plans.length<=1)return toast('É necessário manter pelo menos um plano');
  const {count,error:countError}=await sb.from('agenda_subscriptions').select('*',{count:'exact',head:true}).eq('plan_id',id);
  if(countError){console.error(countError);return toast('Não foi possível verificar os assinantes do plano')}
  if((count||0)>0)return toast(`Este plano possui ${count} assinante(s). Troque o plano desses clientes antes de excluir.`);
  if(!confirm(`Excluir o plano "${pl.name}"?\n\nEsta ação não pode ser desfeita.`))return;
  const {error}=await sb.from('agenda_plans').delete().eq('id',id);
  if(error){
    console.error(error);
    if(String(error.message||'').toLowerCase().includes('foreign key'))return toast('Este plano ainda está ligado a uma assinatura');
    return toast('Não foi possível excluir o plano');
  }
  await loadOwnerData();render();toast('Plano excluído');
}

    function appointmentWhatsMessage(customer,service,date,time,professional,status,confirmationKey='',includeConfirmation=false){
  const first=(customer?.name||'').trim().split(/\s+/)[0]||'';
  const dateBR=String(date||'').split('-').reverse().join('/');
  const link=includeConfirmation?confirmationLink(confirmationKey):'';
  const EMOJI={
    smile:'\u{1F60A}',
    calendar:'\u{1F4C5}',
    clock:'\u{1F550}',
    sparkle:'\u2728',
    person:'\u{1F464}',
    check:'\u2705'
  };
  const lines=[
    `Olá${first?', '+first:''}! ${EMOJI.smile}`,
    '',
    `Seu horário com *${whatsappBusinessName(companyCtx.business.name)}* foi agendado.`,
    '',
    `${EMOJI.calendar} Data: *${dateBR}*`,
    `${EMOJI.clock} Horário: *${time}*`,
    `${EMOJI.sparkle} ${P().service}: *${service?.name||''}*`,
    professional?`${EMOJI.person} ${P().professional}: *${professional}*`:null,
    link?'':'',
    link?'*Confirme seu horário:*':null,
    link?`${EMOJI.check} ${link}`:null
  ].filter(v=>v!==null&&v!==undefined);

    async function saveAppointment(){
  if(!hasFeature('agenda'))return toast('Agenda não incluída no plano');
  const customer_id=document.getElementById('fclient')?.value;
  const service_id=document.getElementById('fservice')?.value;
  const professional_name=(document.getElementById('fpro')?.value||'').trim();
  const date=document.getElementById('fdate')?.value;
  const time=document.getElementById('ftime')?.value;
  const status='pending';
  const notes=document.getElementById('fnote')?.value||'';
  if(!customer_id||!service_id||!date||!time)return toast('Preencha cliente, serviço, data e horário');

  const customer=companyData.customers.find(x=>x.id===customer_id);
  const service=companyData.services.find(x=>x.id===service_id);
  const phone=normalizeWhatsPhone(customer?.phone);
  const autoConnected=!!(whatsappState?.connection?.status==='connected'&&whatsappState?.connection?.auto_confirmation);
  const baileysConnected=!!(companyCtx?.settings?.baileys_enabled&&baileysSession?.status==='connected');
  let whatsWindow=null;

  if(phone&&!autoConnected&&!baileysConnected){
    try{whatsWindow=window.open('about:blank','_blank')}catch(e){}
  }

  const starts_at=new Date(`${date}T${time}:00`).toISOString();
  const {data:created,error}=await sb.from('agenda_appointments').insert({
    business_id:companyCtx.business.id,
    customer_id,
    service_id,
    professional_name:professional_name||null,
    starts_at,
    status,
    notes:notes||null
  }).select('id,confirmation_code,confirmation_token').single();

  if(error){
    console.error(error);
    if(whatsWindow&&!whatsWindow.closed)whatsWindow.close();
    return toast('Não foi possível salvar o horário');
  }

  let automaticSent=false;
  if(phone&&autoConnected&&created?.id){
    try{
      const out=await callAgendaWhatsApp({action:'send_confirmation',appointment_id:created.id});
      automaticSent=!!out?.sent;
      if(automaticSent)await markQueueByAppointment(created.id,'confirmation','done');
    }catch(ex){
      console.error(ex);
      toast('Horário salvo. O envio automático falhou; abrindo WhatsApp manual.');
      const msg=appointmentWhatsMessage(customer,service,date,time,professional_name,status);
      openWhatsAppDirect(phone,msg);
      await markQueueByAppointment(created.id,'confirmation','opened');
    }
  }else if(phone&&!baileysConnected){
    const msg=appointmentWhatsMessage(customer,service,date,time,professional_name,status);
    openWhatsAppDirect(phone,msg,whatsWindow);
    await markQueueByAppointment(created.id,'confirmation','opened');
  }

  await loadCompanyData();
  page='agenda';
  render();
  if(!phone)toast('Horário salvo. Cliente sem WhatsApp cadastrado.');
  else if(automaticSent)toast('Horário salvo e mensagem de agendamento enviada automaticamente');
  else if(baileysConnected)toast('Horário salvo. Mensagem enviada agora e confirmação programada para 24h antes.');
  else if(!autoConnected)toast('Horário salvo. WhatsApp aberto com a mensagem pronta para enviar.');
}

    async function detectAgendaAccess(user){
  authUser=user;
  const {data:profile}=await sb.from('profiles').select('is_platform_admin,display_name,phone').eq('id',user.id).maybeSingle();
  if(profile?.is_platform_admin){
    appMode='owner';ownerLogged=true;companyCtx=null;page='admin';adminTab='overview';
    if(typeof loadOwnerData==='function')await loadOwnerData();
    if(typeof loadMetaPlatformConfig==='function')await loadMetaPlatformConfig(false);
    render();return;
  }
  const {data:member,error:memberError}=await sb.from('agenda_members').select('business_id,role').eq('user_id',user.id).limit(1).maybeSingle();
  if(memberError||!member){
    await sb.auth.signOut();
    loginMessage='Este e-mail já existe, mas ainda não possui uma empresa cadastrada no Agenda Pro. Para criar uma nova conta do Agenda Pro, use outro e-mail.';
    appMode=null;render();return;
  }
  const [{data:business},{data:subscription},{data:settings},{data:preferences}]=await Promise.all([
    sb.from('agenda_businesses').select('*').eq('id',member.business_id).single(),
    sb.from('agenda_subscriptions').select('*').eq('business_id',member.business_id).single(),
    sb.from('agenda_platform_settings').select('*').eq('id',true).maybeSingle(),
    sb.from('agenda_business_preferences').select('*').eq('business_id',member.business_id).maybeSingle()
  ]);
  if(!business||!subscription){
    await sb.auth.signOut();loginMessage='Cadastro da empresa incompleto. Fale com o administrador.';appMode=null;render();return;
  }
  const {data:plan}=await sb.from('agenda_plans').select('*').eq('id',subscription.plan_id).single();
  if(!plan){
    await sb.auth.signOut();loginMessage='Plano da empresa não encontrado.';appMode=null;render();return;
  }
  companyCtx={
    business,
    membership:member,
    subscription,
    plan,
    profile:{display_name:profile?.display_name||user.user_metadata?.display_name||'Usuário',phone:profile?.phone||'',email:user.email||''},
    settings:settings||{auto_block:true,grace_days:5},
    preferences:preferences||{business_id:business.id,show_price_on_booking:true}
  };
  segment=PROFILES[business.segment]?business.segment:'salon';
  appMode='company';ownerLogged=false;page='home';
  if(typeof loadCompanyData==='function')await loadCompanyData();
  render();
}

}
    async function requestPasswordReset(){
  if(!sb)return;
  const email=(document.getElementById('ownerUser')?.value||'').trim().toLowerCase()||prompt('Digite o e-mail da sua conta:');
  if(!email)return;
  const redirectTo=AGENDA_PRO_URL;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
  const e=document.getElementById('loginError');
  if(error){console.error(error);if(e)e.textContent='Não foi possível enviar a recuperação. Confira o e-mail e tente novamente.';return}
  if(e)e.textContent='Enviamos um link de recuperação para o e-mail informado.';
}
    async function finishPasswordReset(){
  const p=document.getElementById('newPassword')?.value||'';
  const p2=document.getElementById('newPassword2')?.value||'';
  const e=document.getElementById('loginError');
  if(p.length<8){if(e)e.textContent='A senha precisa ter pelo menos 8 caracteres.';return}
  if(p!==p2){if(e)e.textContent='As senhas não conferem.';return}
  const {error}=await sb.auth.updateUser({password:p});
  if(error){console.error(error);if(e)e.textContent='Não foi possível atualizar a senha.';return}
  passwordRecovery=false;loginMessage='Senha alterada. Entre com sua nova senha.';
  await sb.auth.signOut();appMode=null;ownerLogged=false;authUser=null;render();
}

  return `<div class="signup-screen"><div class="signup-wrap"><div class="signup-top"><button class="back-login" onclick="closeSignup()">← Voltar</button><div><span class="eyebrow">Novo assinante</span><h1>Crie sua conta</h1><p>Preencha seus dados, escolha sua profissão e o plano que combina com seu trabalho.</p></div></div>${trial}<form class="signup-form" onsubmit="event.preventDefault();selfRegister()"><section class="signup-box"><h3>1. Seus dados</h3><div class="signup-fields"><div class="login-field"><label>Seu nome</label><input id="signupName" autocomplete="name" placeholder="Nome do responsável" required></div><div class="login-field"><label>Nome profissional ou empresa</label><input id="signupBusiness" placeholder="Ex.: Clínica Vida ou Juliana Pereira" required maxlength="120"></div><div class="login-field"><label>Profissão / área de atendimento</label><select id="signupSegment" required>
<option value="salon">Cabeleireiro(a) / Salão de beleza</option>
<option value="manicure">Manicure / Nail Designer</option>

</select></div><div class="login-field"><label>Telefone / WhatsApp</label><input id="signupPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-9999" required></div><div class="login-field"><label>E-mail</label><input id="signupEmail" type="email" autocomplete="email" placeholder="contato@empresa.com" required></div><div class="login-field"><label>Senha</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required></div><div class="login-field"><label>Confirmar senha</label><input id="signupPassword2" type="password" autocomplete="new-password" placeholder="Digite novamente" required></div></div></section><section class="signup-box"><h3>2. Escolha seu plano</h3><div class="signup-plans">${plans}</div></section><div id="signupError" class="login-error">${signupMessage||''}</div><button id="signupButton" class="btn primary signup-submit" type="submit">Criar minha conta</button><p class="signup-footnote">Depois do cadastro, você será direcionado para a página de login.</p></form></div></div>`;

    async function openSignup(){
  signupMode=true;signupLoading=true;signupMessage='';signupWaitingEmail='';render();
  const [plansRes,settingsRes]=await Promise.all([
    sb.from('agenda_plans').select('code,name,monthly_price_cents,max_users,permissions,description,visible,active').eq('active',true).eq('visible',true).order('monthly_price_cents'),
    sb.from('agenda_platform_settings').select('public_signup_enabled,free_trial_enabled,trial_days').eq('id',true).maybeSingle()
  ]);
  if(plansRes.error||settingsRes.error){
    console.error(plansRes.error||settingsRes.error);
    signupLoading=false;signupMessage='Não foi possível carregar os planos. Tente novamente.';render();return;
  }
  signupPlans=plansRes.data||[];
  signupSettings={...signupSettings,...(settingsRes.data||{})};
  if(!signupSettings.public_signup_enabled){
    signupLoading=false;signupMessage='Novos cadastros estão temporariamente fechados.';render();return;
  }
  if(!signupPlans.some(p=>p.code===signupSelectedPlan))signupSelectedPlan=signupPlans[0]?.code||'';
  signupLoading=false;render();
}
    function finishSignupToLogin(){
  signupMode=false;
  signupLoading=false;
  signupMessage='';
  signupWaitingEmail='';
  loginMessage='Conta criada com sucesso. Entre com seu e-mail e senha.';
  render();
  const input=document.getElementById('ownerUser');
  if(input){
    input.value=loginPrefillEmail;
    input.focus();
  }
}
    function closeSignup(){
  signupMode=false;signupLoading=false;signupMessage='';signupWaitingEmail='';render();
}
    function selectSignupPlan(code){
  signupSelectedPlan=code;
  document.querySelectorAll('.signup-plan').forEach(card=>{
    const radio=card.querySelector('input[name="signupPlan"]');
    const selected=radio?.value===code;
    card.classList.toggle('selected',selected);
    if(radio)radio.checked=selected;
  });
}
    async function selfRegister(){
  if(!sb||signupLoading)return;
  const name=(document.getElementById('signupName')?.value||'').trim();
  const business=(document.getElementById('signupBusiness')?.value||'').trim();
  const segment=document.getElementById('signupSegment')?.value||'';
  const phone=(document.getElementById('signupPhone')?.value||'').replace(/\D/g,'');
  const email=(document.getElementById('signupEmail')?.value||'').trim().toLowerCase();
  const password=document.getElementById('signupPassword')?.value||'';
  const password2=document.getElementById('signupPassword2')?.value||'';
  const e=document.getElementById('signupError'),btn=document.getElementById('signupButton');
  if(!signupSettings.public_signup_enabled){if(e)e.textContent='Novos cadastros estão temporariamente fechados.';return}
  if(name.length<2||business.length<2||!email){if(e)e.textContent='Preencha seu nome, empresa e e-mail.';return}
  if(phone.length<10||phone.length>13){if(e)e.textContent='Informe um telefone/WhatsApp válido com DDD.';return}
  if(password.length<8){if(e)e.textContent='A senha precisa ter pelo menos 8 caracteres.';return}
  if(password!==password2){if(e)e.textContent='As senhas não conferem.';return}
  if(!signupPlans.some(p=>p.code===signupSelectedPlan)){if(e)e.textContent='Escolha um plano válido.';return}
  if(btn){btn.disabled=true;btn.textContent='Criando conta...'}
  const redirectTo=AGENDA_PRO_URL;
  const {data,error}=await sb.auth.signUp({
    email,password,
    options:{
      emailRedirectTo:redirectTo,
      data:{
        agenda_pro_signup:true,
        display_name:name,
        contact_name:name,
        phone,
        business_name:business,
        company_name:business,
        segment,
        plan_code:signupSelectedPlan
      }
    }
  });
  if(error){
    console.error(error);
    if(e)e.textContent=error.message?.toLowerCase().includes('disabled')?'Novos cadastros estão temporariamente fechados.':'Não foi possível criar a conta. Confira os dados e tente novamente.';
    if(btn){btn.disabled=false;btn.textContent='Criar minha conta'}
    return;
  }
  const repeated=!!data?.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0;
  if(repeated){
    signupWaitingEmail='';
    signupMessage='Este e-mail já possui um cadastro em outro sistema e não pode ser usado para criar uma nova conta do Agenda Pro. Use outro e-mail.';
    if(e)e.textContent=signupMessage;
    if(btn){btn.disabled=false;btn.textContent='Criar minha conta'}
    return;
  }
  loginPrefillEmail=email;
  signupMessage='';
  signupWaitingEmail=email;
  if(data?.session){
    await sb.auth.signOut();
    authUser=null;appMode=null;ownerLogged=false;companyCtx=null;
  }
  render();
}
    function loginView(){
  return `<div class="login-screen"><section class="login-brand"><div class="logo">AP</div><h1>Agenda profissional para qualquer área.</h1><p>Médicos, psicólogos, terapeutas, manicures, esteticistas e outros profissionais podem criar a própria conta e adaptar o sistema ao seu tipo de atendimento.</p><div class="login-feature"><i>✓</i> Conta separada para cada empresa</div><div class="login-feature"><i>✓</i> Plano e limite de usuários controlados automaticamente</div><div class="login-feature"><i>✓</i> Dados protegidos por empresa</div></section><section class="login-panel"><form class="login-card" onsubmit="return doOwnerLogin(event)"><span class="eyebrow">Já tenho conta</span><h2>Entrar no Agenda Pro</h2><p>Use seu e-mail e senha.</p><div class="login-field"><label>E-mail</label><input id="ownerUser" type="email" autocomplete="username" placeholder="seuemail@empresa.com" autofocus></div><div class="login-field"><label>Senha</label><input id="ownerPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div><div id="loginError" class="login-error">${loginMessage||''}</div><button id="loginButton" class="btn primary" style="width:100%;min-height:48px" type="submit">Entrar</button><button class="signup-main-btn" type="button" onclick="openSignup()">Criar minha conta</button><button class="forgot-link" type="button" onclick="requestPasswordReset()">Esqueci minha senha</button><div class="login-help"><b>É assinante novo?</b> Clique em “Criar minha conta”, escolha o plano e faça seu cadastro sem precisar falar com o administrador.</div></form></section></div>`;
}
    function doOwnerLogin(ev){ev?.preventDefault();signInAgendaPro();return false}
    function ownerLogout(){
  if(whatsappQueueTimer){clearInterval(whatsappQueueTimer);whatsappQueueTimer=null}
  if(baileysPollTimer){clearInterval(baileysPollTimer);baileysPollTimer=null}
  if(sb)sb.auth.signOut();
  authUser=null;appMode=null;ownerLogged=false;companyCtx=null;companyData={customers:[],services:[],appointments:[],financialEntries:[]};teamState={members:[],count:0,maxUsers:null,loading:false,loaded:false};whatsappQueue=[];page='home';adminTab='overview';loginMessage='';render();
}
    function go(p){
  closeMobileMenu();
  if(!appMode){render();return}
  if(appMode==='owner'){page='admin';adminTab=['overview','clients','plans','billing','settings'].includes(p)?p:'overview';render();scrollTo(0,0);return}
  const allowed={home:true,agenda:hasFeature('agenda'),services:hasFeature('agenda'),clients:hasFeature('clients'),cash:hasFeature('finance'),wa:true,team:canAdminCompany(),profile:true};
  if(!allowed[p])return toast(p==='team'?'Seu perfil não permite gerenciar usuários':'Este recurso não está incluído no seu plano');
  page=p;render();scrollTo(0,0);
  if(p==='team')setTimeout(()=>loadTeamMembers(true),0);
}
    function book(){
  if(appMode!=='company')return toast('Agendamentos ficam no acesso das empresas');
  if(!hasFeature('agenda'))return toast('Agenda não incluída no seu plano');
  if(!canOperateCompany())return toast('Seu perfil é somente visualização');
  page='book';render();scrollTo(0,0);
}
    function toast(x){const e=document.getElementById('toast');e.textContent=x;e.hidden=false;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.hidden=true,1900)}
    function render(){
  if(PUBLIC_CONFIRMATION_KEY){
    document.title='Confirmar horário · Agenda Pro';
    R.innerHTML=publicConfirmationView();
    return;
  }
  if(authLoading){document.title='Agenda Pro';R.innerHTML='<div class="auth-loading"><div class="logo">AP</div><b>Carregando Agenda Pro...</b></div>';return}
  if(passwordRecovery){document.title='Agenda Pro · Nova senha';R.innerHTML=resetPasswordView();return}
  if(signupMode){document.title='Agenda Pro · Criar conta';R.innerHTML=signupView();return}
  if(!appMode){document.title='Agenda Pro · Login';R.innerHTML=loginView();return}
  if(appMode==='owner'){document.title='Agenda Pro · Administração';page='admin';R.innerHTML=admin();return}
  document.title=displayBusinessName(companyCtx?.business?.name||'Agenda Pro')+' · Agenda Pro';
  if(companyAccessBlocked()){R.innerHTML=companyBlockedView();return}
  R.innerHTML=page==='book'?booking():({home,agenda,clients,services,cash,wa,team,profile:myProfile}[page]||home)();
}
    window.addEventListener('beforeinstallprompt',event=>{
      event.preventDefault();
      deferredPwaPrompt=event;
      if(appMode)render();
    });
    window.addEventListener('appinstalled',()=>{
      deferredPwaPrompt=null;
      if(appMode)render();
      toast('Agenda Pro instalado com sucesso');
    });
    if('serviceWorker' in navigator){
      let agendaSwRefreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(agendaSwRefreshing)return;
        agendaSwRefreshing=true;
        window.location.reload();
      });
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('/sw.js?v=20261006-pairreset37',{scope:'/',updateViaCache:'none'})
          .then(reg=>reg.update())
          .catch(err=>console.error('Service Worker:',err));
      });
    }
    render();
    if(PUBLIC_CONFIRMATION_KEY)loadPublicConfirmation();
    else initSupabase();
  </script>
