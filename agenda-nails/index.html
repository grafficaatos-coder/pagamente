<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Nails Pro</title><style>
:root{--bg:#f8f6f6;--card:#fff;--ink:#30272b;--muted:#897c82;--line:#eadfe2;--wine:#674956;--rose:#f5e9ed;--green:#e5f2eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:205px 1fr}.side{height:100vh;position:sticky;top:0;background:#392f34;color:#fff;padding:20px 12px}.brand{display:flex;align-items:center;gap:10px;padding:0 7px 20px}.logo{width:40px;height:40px;border-radius:13px;background:#8c6474;display:grid;place-items:center;font:700 18px Georgia}.brand b,.brand small{display:block}.brand small{color:#c5b5bb;font-size:9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cfc1c6;padding:11px;border-radius:11px;text-align:left}.nav button.on,.nav button:hover{background:#f4e8ec;color:#5d414e}.main{min-width:0}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(248,246,246,.96);position:sticky;top:0;z-index:20}.top h1{margin:0;font-size:19px}.top small{color:var(--muted)}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:var(--wine);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.content{max-width:1020px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.hero h2{font:600 28px Georgia;margin:3px 0}.hero p{margin:0;color:var(--muted)}.eyebrow{font-size:9px;letter-spacing:1.3px;color:#9b7f8a;font-weight:900;text-transform:uppercase}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.metric,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.metric{padding:15px}.metric span{color:var(--muted);font-size:11px}.metric b{display:block;font-size:23px;margin:7px 0 3px}.metric small{color:var(--muted)}.panel{padding:16px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.head h3{margin:2px 0}.appt{display:grid;grid-template-columns:58px 1fr 92px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f2e9ec}.appt:last-child{border:0}.appt small{display:block;color:var(--muted);margin-top:3px}.tag{background:var(--green);color:#4c755f;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:900;text-align:center}.tag.p{background:#f7edd8;color:#836434}.toolbar{display:flex;gap:10px;margin-bottom:12px}.viewtoggle{display:inline-flex;background:#eee6e9;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}.viewtoggle button{border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:9px;font-weight:800}.viewtoggle button.on{background:#fff;color:var(--wine);box-shadow:0 2px 8px rgba(70,45,55,.06)}.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.daycol{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.dayhead{padding:11px 12px;background:#faf7f8;border-bottom:1px solid var(--line)}.dayhead b,.dayhead small{display:block}.dayhead small{color:var(--muted);margin-top:2px}.mini{padding:10px 11px;border-bottom:1px solid #f2e9ec}.mini:last-child{border-bottom:0}.mini b,.mini small{display:block}.mini small{color:var(--muted);margin-top:2px;font-size:11px}.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px}.list{display:grid;gap:9px}.card{padding:14px}.client{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}.round{width:42px;height:42px;border-radius:12px;background:var(--rose);display:grid;place-items:center;font-weight:900}.client small{display:block;color:var(--muted);margin-top:3px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service h3{margin:5px 0}.service p{color:var(--muted);font-size:12px}.service footer{display:flex;justify-content:space-between;font-weight:900}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.money .card b{display:block;font-size:22px;margin-top:7px}.auto{display:flex;align-items:center;justify-content:space-between}.toggle{width:44px;height:25px;border-radius:999px;background:#d8d0d3;position:relative}.toggle:after{content:"";position:absolute;width:19px;height:19px;background:#fff;border-radius:50%;left:3px;top:3px}.toggle.on{background:#6d9d86}.toggle.on:after{left:22px}.more,.bottom{display:none}.booking{min-height:100vh;background:#f7f1f3;padding:25px}.bookwrap{max-width:860px;margin:auto;display:grid;grid-template-columns:.75fr 1.25fr;gap:22px;align-items:center}.bookintro h1{font:600 38px Georgia}.bookintro p{color:var(--muted);line-height:1.6}.book{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.steps{display:flex;gap:5px;margin-bottom:16px}.steps i{height:4px;background:#eadfe2;flex:1;border-radius:5px}.steps i.on{background:var(--wine)}.choices{display:grid;gap:8px}.choice{border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;justify-content:space-between;align-items:center}.choice small{display:block;color:var(--muted);margin-top:3px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.times button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:11px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;width:100%}.field textarea{min-height:76px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkrow{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf7f8;margin-top:10px}.checkrow input{margin-top:2px}.demo{display:inline-block;background:#f7edd8;color:#836434;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;margin-left:6px}.success{text-align:center;padding:18px}.toast{position:fixed;right:18px;bottom:18px;background:#382d32;color:#fff;padding:11px 14px;border-radius:11px;z-index:99}
@media(max-width:800px){.app{grid-template-columns:74px 1fr}.brand>div:not(.logo),.nav span{display:none}.nav button{text-align:center}.metrics{grid-template-columns:1fr 1fr}.services{grid-template-columns:1fr 1fr}}
@media(max-width:650px){body{font-size:15px}.app{display:block}.side{display:none}.main{padding-bottom:82px}.top{height:60px;padding:0 13px}.top small{display:none}.content{padding:13px}.hero{align-items:flex-start;flex-direction:column;gap:10px}.hero .primary{width:100%;min-height:47px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric:nth-child(3){display:none}.metric{padding:12px}.metric b{font-size:20px}.panel{padding:13px}.appt{grid-template-columns:52px 1fr}.appt .tag{display:none}.client{grid-template-columns:42px 1fr}.client>div:last-child{display:none}.services,.money{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:5px 5px calc(5px + env(safe-area-inset-bottom));z-index:60}.bottom button{border:0;background:transparent;color:#8d7d83;min-height:52px;border-radius:10px;font-size:10px;font-weight:800}.bottom button b{display:block;font-size:18px}.bottom button.on{background:var(--rose);color:var(--wine)}.viewtoggle{display:flex;width:100%}.viewtoggle button{flex:1}.weekgrid{grid-template-columns:1fr}.daycol{border-radius:15px}.booking{padding:12px}.bookwrap{grid-template-columns:1fr}.bookintro{display:flex;align-items:center;gap:10px}.bookintro h1,.bookintro p{display:none}.bookintro .secondary{margin-left:auto}.book{padding:15px}.times{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.toast{left:12px;right:12px;bottom:78px;text-align:center}}
</style></head><body><div id="root"></div><div id="toast" class="toast" hidden></div><script>
const A=[['09:00','Mariana Costa','Manicure em Gel','Ana Souza','c'],['10:30','Camila Rocha','Pé + Mão','Bruna Lima','c'],['13:00','Juliana Alves','Alongamento Fibra','Ana Souza','p'],['15:00','Patrícia Melo','Manutenção','Carla Dias','c'],['17:30','Fernanda Luz','Spa dos Pés','Bruna Lima','c']],C=[['Mariana Costa','(41) 99912-2233','12','R$ 1.240'],['Camila Rocha','(41) 98822-3344','8','R$ 790'],['Juliana Alves','(41) 97731-5532','19','R$ 2.480'],['Patrícia Melo','(41) 96641-8821','6','R$ 620']],S=[['Manicure Tradicional','45 min','R$ 35'],['Pé + Mão','90 min','R$ 65'],['Esmaltação em Gel','75 min','R$ 75'],['Alongamento Fibra','150 min','R$ 160'],['Manutenção de Fibra','120 min','R$ 95'],['Spa dos Pés','60 min','R$ 70']];let page='home',step=1,b={s:'',p:'',t:''},agendaView='day';const R=document.getElementById('root'),T={home:['Início','Resumo de hoje'],agenda:['Agenda','Horários do dia'],clients:['Clientes','Cadastro e histórico'],services:['Serviços','Preços e duração'],cash:['Caixa','Resumo financeiro'],wa:['WhatsApp','Lembretes automáticos'],more:['Mais','Outras funções']};
function nav(){let n=[['home','⌂','Início'],['agenda','▦','Agenda'],['clients','♙','Clientes'],['services','◇','Serviços'],['cash','R$','Caixa'],['wa','◉','WhatsApp']];return `<aside class="side"><div class="brand"><div class="logo">AN</div><div><b>Agenda Nails</b><small>PRO</small></div></div><nav class="nav">${n.map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')"><span><b>${x[1]}</b> ${x[2]}</span></button>`).join('')}</nav></aside>`}function bottom(){let n=[['home','⌂','Início'],['agenda','▦','Agenda'],['clients','♙','Clientes'],['cash','R$','Caixa'],['more','•••','Mais']],a=['services','wa'].includes(page)?'more':page;return `<nav class="bottom">${n.map(x=>`<button class="${a==x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}function shell(x){let t=T[page]||T.home;return `<div class="app">${nav()}<main class="main"><header class="top"><div><h1>${t[0]}</h1><small>${t[1]}</small></div><button class="btn primary" onclick="book()">+ Novo horário</button></header><div class="content">${x}</div></main>${bottom()}</div>`}function ap(a){return `<div class="appt"><b>${a[0]}</b><div><b>${a[1]}</b><small>${a[2]} · ${a[3]}</small></div><span class="tag ${a[4]=='p'?'p':''}">${a[4]=='p'?'Pendente':'Confirmado'}</span></div>`}
function home(){return shell(`<section class="hero"><div><span class="eyebrow">Hoje</span><h2>Bom dia, Ana.</h2><p>O essencial do seu dia em uma tela.</p></div><button class="btn primary" onclick="book()">+ Novo horário</button></section><section class="metrics"><div class="metric"><span>Faturamento hoje</span><b>R$ 1.485</b><small>▲ 18%</small></div><div class="metric"><span>Horários de hoje</span><b>14</b><small>11 confirmados</small></div><div class="metric"><span>Ocupação semanal</span><b>84%</b><small>Meta 80%</small></div></section><section class="panel"><div class="head"><div><span class="eyebrow">Agenda de hoje</span><h3>Próximos atendimentos</h3></div><button class="btn secondary" onclick="go('agenda')">Abrir agenda</button></div>${A.map(ap).join('')}</section>`)}function agenda(){const week=[['Seg','05/10',[['09:00','Mariana','Gel'],['14:00','Paula','Pé + Mão']]],['Ter','06/10',[['10:30','Camila','Pé + Mão'],['16:00','Renata','Manicure']]],['Qua','07/10',[['09:30','Juliana','Fibra'],['15:00','Patrícia','Manutenção']]],['Qui','08/10',[['11:00','Fernanda','Spa dos Pés'],['17:30','Bianca','Gel']]],['Sex','09/10',[['09:00','Larissa','Manicure'],['13:30','Aline','Pé + Mão'],['17:00','Carla','Gel']]]];let body=agendaView==='day'?`<section class="panel"><div class="head"><h3>Agenda do dia</h3><span class="tag">5 horários</span></div>${A.map(ap).join('')}</section>`:`<div class="weekgrid">${week.map(d=>`<section class="daycol"><div class="dayhead"><b>${d[0]}</b><small>${d[1]}</small></div>${d[2].map(x=>`<div class="mini"><b>${x[0]} · ${x[1]}</b><small>${x[2]}</small></div>`).join('')}</section>`).join('')}</div>`;return shell(`<div class="toolbar"><input class="search" placeholder="Buscar cliente"><button class="btn primary" onclick="book()">+ Horário</button></div><div class="viewtoggle"><button class="${agendaView==='day'?'on':''}" onclick="setAgendaView('day')">Dia</button><button class="${agendaView==='week'?'on':''}" onclick="setAgendaView('week')">Semana</button></div>${body}`)}function clients(){return shell(`<div class="toolbar"><input class="search" placeholder="Buscar cliente"><button class="btn primary" onclick="toast('Cadastro aberto')">+ Cliente</button></div><div class="list">${C.map(c=>`<div class="card client"><div class="round">${c[0].split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><b>${c[0]}</b><small>${c[1]} · ${c[2]} visitas</small></div><div><b>${c[3]}</b><small>Total gasto</small></div></div>`).join('')}</div>`)}function services(){return shell(`<div class="toolbar"><h2 style="margin:0">Serviços</h2><button class="btn primary" onclick="toast('Novo serviço')">+ Serviço</button></div><div class="services">${S.map(s=>`<article class="card service"><h3>${s[0]}</h3><p>Disponível para agendamento online.</p><footer><span>${s[1]}</span><b>${s[2]}</b></footer></article>`).join('')}</div>`)}function cash(){return shell(`<div class="money"><div class="card"><span>Entradas</span><b>R$ 18.940</b></div><div class="card"><span>Despesas</span><b>R$ 5.280</b></div><div class="card"><span>Saldo</span><b>R$ 13.660</b></div></div><section class="panel"><h3>Últimos lançamentos</h3><div class="list">${[['Manicure · Mariana','+ R$ 75'],['Pé + Mão · Camila','+ R$ 65'],['Compra de esmaltes','− R$ 320'],['Alongamento · Juliana','+ R$ 160']].map(x=>`<div class="card" style="display:flex;justify-content:space-between"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section>`)}function wa(){let x=[['Confirmação ao salvar horário','Envia assim que a dona do salão cria o agendamento'],['Lembrete 24h','Um dia antes'],['Lembrete 2h','No dia'],['Pós-atendimento','Pedido de avaliação']];return shell(`<section class="panel" style="margin-bottom:10px"><span class="eyebrow">WhatsApp</span><h2 style="margin:5px 0">Lembretes automáticos <span class="demo">DEMO</span></h2><p style="color:var(--muted)">A confirmação imediata já está preparada no fluxo de novo horário. O envio real será ativado quando conectarmos o WhatsApp.</p></section><div class="list">${x.map((i,n)=>`<div class="card auto"><div><b>${i[0]}</b><small style="display:block;color:var(--muted);margin-top:3px">${i[1]}</small></div><div class="toggle ${n<3?'on':''}" onclick="this.classList.toggle('on')"></div></div>`).join('')}</div>`)}function more(){return shell(`<div class="list"><button class="card" onclick="go('services')">◇ <b>Serviços</b></button><button class="card" onclick="go('wa')">◉ <b>WhatsApp</b></button><button class="card" onclick="book()">↗ <b>Página de agendamento</b></button></div>`)}
function booking(){return `<div class="booking"><div class="bookwrap"><section class="bookintro"><div class="logo">AN</div><h1>Novo horário</h1><p>Agendamento interno feito pela dona do salão.</p><button class="btn secondary" onclick="go('agenda')">← Voltar para agenda</button></section><section class="book"><span class="eyebrow">Agendamento interno</span><h2 style="margin:5px 0 12px">Cadastrar horário</h2><div class="formgrid"><div class="field"><b>Cliente</b><select id="fclient" onchange="fillPhone()"><option value="">Selecione</option>${C.map(c=>`<option value="${c[0]}">${c[0]}</option>`).join('')}<option value="nova">+ Nova cliente</option></select></div><div class="field"><b>WhatsApp</b><input id="fphone" placeholder="(41) 99999-9999"></div><div class="field"><b>Serviço</b><select id="fservice">${S.map(x=>`<option>${x[0]}</option>`).join('')}</select></div><div class="field"><b>Profissional</b><select id="fpro"><option>Ana Souza</option><option>Bruna Lima</option><option>Carla Dias</option></select></div><div class="field"><b>Data</b><input id="fdate" type="date"></div><div class="field"><b>Horário</b><input id="ftime" type="time"></div><div class="field"><b>Valor</b><input id="fvalue" placeholder="R$ 0,00"></div><div class="field"><b>Status</b><select id="fstatus"><option>Confirmado</option><option>Pendente</option></select></div></div><div class="field"><b>Observação</b><textarea id="fnote" placeholder="Observação opcional"></textarea></div><label class="checkrow"><input id="fsend" type="checkbox" checked><span><b>Enviar confirmação no WhatsApp ao salvar</b><small style="display:block;color:var(--muted);margin-top:3px">Modo demonstração <span class="demo">WhatsApp ainda não conectado</span></small></span></label><button class="btn primary" style="width:100%;margin-top:12px;min-height:46px" onclick="saveAppointment()">Salvar horário</button></section></div></div>`}
function fillPhone(){let n=document.getElementById('fclient').value,c=C.find(x=>x[0]===n);document.getElementById('fphone').value=c?c[1]:''}
function saveAppointment(){let client=document.getElementById('fclient').value,phone=document.getElementById('fphone').value,service=document.getElementById('fservice').value,pro=document.getElementById('fpro').value,date=document.getElementById('fdate').value,time=document.getElementById('ftime').value,status=document.getElementById('fstatus').value,send=document.getElementById('fsend').checked;if(!client||client==='nova'||!phone||!date||!time)return toast('Preencha cliente, WhatsApp, data e horário');A.unshift([time,client,service,pro,status==='Pendente'?'p':'c']);page='agenda';agendaView='day';render();setTimeout(()=>toast(send?'Horário salvo · confirmação de WhatsApp simulada':'Horário salvo'),100)}
function setAgendaView(v){agendaView=v;render()}function go(p){page=p;step=1;render();scrollTo(0,0)}function book(){page='book';step=1;render()}function pickS(v){b.s=v;step=2;render()}function pickP(v){b.p=v;step=3;render()}function pickT(v){b.t=v;step=4;render()}function back(){step--;render()}function done(){if(!name.value||!phone.value)return toast('Preencha nome e WhatsApp');step=5;render()}function reset(){step=1;b={s:'',p:'',t:''};render()}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.hidden=false;setTimeout(()=>e.hidden=true,1800)}function render(){if(page=='book'){R.innerHTML=booking();return}R.innerHTML=({home,agenda,clients,services,cash,wa,more}[page]||home)()}render();
</script></body></html>
