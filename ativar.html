<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ativar liderança</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f4;font-family:system-ui;color:#172a27}
.card{width:min(92vw,400px);background:#fff;border:1px solid #e3e9e5;border-radius:18px;padding:26px;box-shadow:0 10px 28px rgba(32,61,51,.08)}
h1{font-size:22px;margin:0 0 8px}p{color:#71807b;font-size:13px}.field{display:grid;gap:7px;font-size:12px;font-weight:700;margin:14px 0}
.field input{padding:12px;border:1px solid #e3e9e5;border-radius:10px;font:inherit}button{width:100%;padding:11px;border:0;border-radius:10px;background:#246957;color:#fff;font-weight:800;font:inherit;cursor:pointer}
.msg{margin-top:13px;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="card">
<h1>Ativar liderança</h1>
<p>Crie a senha principal do sistema.</p>
<form id="f">
<label class="field">Crie sua senha<input id="p1" type="password" minlength="10" required></label>
<label class="field">Repita a senha<input id="p2" type="password" minlength="10" required></label>
<button type="submit">Ativar sistema</button>
</form>
<div id="m" class="msg"></div>
</div>
<script>
const API='https://eqqssdgyapregubyhllo.supabase.co/functions/v1/church-accounts';
const code=new URLSearchParams(location.search).get('code')||'';
document.getElementById('f').onsubmit=async e=>{
 e.preventDefault();
 const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,m=document.getElementById('m');
 if(!code){m.textContent='Link de ativação inválido.';m.style.color='#a74e37';return}
 if(p1!==p2){m.textContent='As senhas não conferem.';m.style.color='#a74e37';return}
 if(p1.length<10){m.textContent='Use pelo menos 10 caracteres.';m.style.color='#a74e37';return}
 m.textContent='Ativando...';m.style.color='#71807b';
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'activate',code,password:p1})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Falha na ativação.');
  m.textContent='Sistema ativado. Agora volte para a página principal e entre com seu e-mail e senha.';
  m.style.color='#246957';e.target.reset();
 }catch(err){m.textContent=err.message;m.style.color='#a74e37'}
};
</script>
</body></html>
