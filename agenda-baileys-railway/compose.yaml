# Agenda Pro - teste local. Não executar simultaneamente com o mesmo WhatsApp no Railway.
services:
  agenda-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: agenda-pro-whatsapp:local
    container_name: agenda-pro-whatsapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      DISPATCH_ENABLED: "false"
      # Rollout isolated to Julli; approval/freshness checked again in Supabase.
      JULLI_AUTO_DISPATCH_ENABLED: "true"
      # Ativa somente a empresa técnica; não libera a fila dos demais assinantes.
      TEST_AUTO_DISPATCH_ENABLED: "${TEST_AUTO_DISPATCH_ENABLED:-false}"
      LOCAL_POLL_ENABLED: "${LOCAL_POLL_ENABLED:-false}"
      ALLOW_ALL_BUSINESSES: "false"
      # Allow-listed WhatsApps for controlled repa​iring; dispatch remains OFF.
      ALLOWED_BUSINESS_IDS: "270de0ad-2013-4afb-b8ba-2e21175b3f01,afa8a4ed-f57a-49d4-9f7b-63a33eb4e2ae,7f00c45b-b228-4ee8-b795-aadbdcfb9d45,9f97ef4d-78e9-4251-bdfc-66f26497f06b"
    volumes:
      - agenda_whatsapp_sessions:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  agenda_whatsapp_sessions:
