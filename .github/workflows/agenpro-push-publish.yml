name: Publicar notificacoes PWA do AgenPro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agenpro-push-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenpro-push-publish
  cancel-in-progress: false

jobs:
  publish-push:
    if: github.repository == 'grafficaatos-coder/pagamente'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Aplicar notificacoes
        run: |
          python3 -m py_compile tools/apply_agenpro_push.py
          python3 tools/apply_agenpro_push.py

      - name: Validar arquivos e JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('agenda-nails/index.html').read_text(encoding='utf-8')
          assert '/appointment-push.js?v=20261023-7' in html
          assert 'id="agenpro-response-bell"' in html
          assert "const AGENDA_UI_VERSION='2026.10.23.7';" in html
          js=html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/agenpro-inline-verify.js').write_text(js,encoding='utf-8')
          sw=Path('agenda-nails/sw.js').read_text(encoding='utf-8')
          assert "addEventListener('push'" in sw and "addEventListener('notificationclick'" in sw
          PY
          node --check /tmp/agenpro-inline-verify.js
          node --check agenda-nails/appointment-push.js
          node --check agenda-nails/sw.js
          git diff --check

      - name: Publicar atualizacao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda-nails/index.html agenda-nails/sw.js agenda-nails/app-version.json
          if git diff --cached --quiet; then echo 'Versao PWA ja publicada'; exit 0; fi
          git commit -m "feat(agenpro): PWA push for customer confirmations and declines"
          git push origin HEAD:main
