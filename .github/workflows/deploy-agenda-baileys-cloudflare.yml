name: Deploy Agenda Pro Baileys to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agenda-nails/baileys-cloudflare/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-nails/baileys-cloudflare

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://zmrihyzwsyxjikdknfug.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nX-qLw9rEdLUvZpgXMj1LA_2gjB3umn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket create agenda-pro-whatsapp-sessions >/tmp/r2-create.log 2>&1; then
            cat /tmp/r2-create.log
          else
            cat /tmp/r2-create.log
            if grep -Eqi "already exists|already been taken|duplicate" /tmp/r2-create.log; then
              echo "R2 bucket already exists."
            else
              exit 1
            fi
          fi

      - name: Configure Worker secrets
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put SUPABASE_PUBLISHABLE_KEY

          INTERNAL_TOKEN="$(
            printf 'agenda-pro-baileys:%s' "$SUPABASE_SERVICE_ROLE_KEY" |
              sha256sum |
              awk '{print $1}'
          )"
          printf '%s' "$INTERNAL_TOKEN" | npx wrangler secret put INTERNAL_TOKEN

      - name: Deploy Worker and Container
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log

          WORKER_URL="$(
            grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log |
              tail -n 1 |
              sed 's/[),.;]*$//'
          )"

          if [ -z "$WORKER_URL" ]; then
            echo "Could not detect workers.dev URL from Wrangler output."
            exit 1
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL"

      - name: Health check
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$WORKER_URL/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare Worker did not become healthy."
          exit 1

      - name: Enable Baileys in Agenda Pro
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail

          BODY="$(
            jq -nc               --arg url "$WORKER_URL"               '{baileys_enabled:true,baileys_service_url:$url,updated_at:(now|todateiso8601)}'
          )"

          curl -fsS             "$SUPABASE_URL/rest/v1/agenda_platform_settings?id=eq.true"             -X PATCH             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -H "Prefer: return=minimal"             --data "$BODY"

          echo "Agenda Pro Baileys enabled at $WORKER_URL"
