name: Baileys Railway - validar pareamento
on:
  pull_request:
    branches:
      - codex/agenda-railway-migration
    paths:
      - "agenda-baileys-railway/**"
      - ".github/workflows/baileys-railway-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agenda-baileys-railway/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: agenda-baileys-railway
      - name: Validate syntax
        run: node --check server.mjs && node --check auth-state.mjs
        working-directory: agenda-baileys-railway
      - name: Run tests
        run: npm test
        working-directory: agenda-baileys-railway
